authentication:
  - type: oauth
    note: >-
      Recommended. Add the server URL to the AI client; it redirects through
      Govly sign-in. Manage under Settings -> API -> Connected Apps.
  - type: bearer
    note: >-
      Personal API key from Settings -> API -> API Keys, sent as
      "Authorization: Bearer gk_<personal_api_key>". Token shown only once.
requirements: >-
  Requires a paid Govly seat. Some tools enforce daily limits without Enterprise
  API access. Shared service accounts require contacting support@govly.com.
client_config_example: |
  {
    "mcpServers": {
      "govly": {
        "url": "https://app.govly.com/api/mcp",
        "headers": { "Authorization": "Bearer gk_<your_personal_api_key>" }
      }
    }
  }
