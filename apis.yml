aid: govly
name: Govly
description: >-
  Govly is an AI-powered market network for government contractors — primes, OEMs,
  VARs, and distributors — that ingests, parses, and analyzes federal and SLED
  (state, local, education) procurement data to surface RFQ/RFI opportunities and
  contract awards across 40+ federal contract vehicles and state/local procurement
  portals. The platform provides pipeline building, award tracking, competitor
  intelligence, AI matching agents, shared opportunity workspaces, and quote
  submission automation. Govly exposes an enterprise Tools API (agent- and
  automation-oriented, REST/JSON over HTTPS with API-key auth), a hosted MCP
  server for AI clients, webhooks for real-time opportunity and workspace events,
  and CRM integrations (Salesforce, HubSpot). Govly is SOC 2 Type I and CMMC
  compliant, hosted on AWS in the USA, and backed by Insight Partners.
