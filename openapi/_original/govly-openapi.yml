  /api/tools/v1/awards/saved_searches:
    get:
      tags: [Saved Searches]
      operationId: list_award_saved_searches
      summary: List award saved searches
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/perPage"
      responses:
        "200":
          description: Award saved searches
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SavedSearch"
                  meta:
                    $ref: "#/components/schemas/CursorMeta"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [Saved Searches]
      operationId: create_award_saved_search
      summary: Create an award saved search
      description: >
        Saves a set of award search criteria as a replayable search. Award saved
        searches do not send notifications — run one any time with the results
        endpoint. The date window is stored as relative day offsets and defaults
        to the last year. The market the search is created under is stored and
        bounds every replay, so set searchType explicitly when scoping to a state
        or local place. Stored filters can be changed but not removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  description: Display name for the saved search.
                query:
                  type: string
                  description: Free-text search terms.
                searchType:
                  type: string
                  enum: [fed, sled, international]
                  description: >
                    Market this search covers. Defaults to the caller's market focus and is
                    stored, so it bounds every later replay.
                recipientNames:
                  type: array
                  items:
                    type: string
                  description: Recipient/vendor names to filter by.
                buyerNames:
                  type: array
                  items:
                    type: string
                  description: Awarding buyer names.
                funderNames:
                  type: array
                  items:
                    type: string
                  description: Funding agency names.
                naics:
                  type: array
                  items:
                    type: string
                  description: NAICS codes to filter by.
                psc:
                  type: array
                  items:
                    type: string
                  description: Product/service codes.
                amountRange:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
                  description: "[min, max] awarded amount."
                placeIds:
                  type: array
                  items:
                    type: string
                  description: >
                    Canonical Govly Place ids to scope the saved search to, from the place
                    search or list tools. Matches at any administrative level. Bounded by the
                    stored market, and changeable but not removable.
                placeIdsNone:
                  type: array
                  items:
                    type: string
                  description: Canonical Govly Place ids to exclude. Same matching rules as placeIds.
                dateRangeParam:
                  type: string
                  description: Which award date field the relative window applies to.
                relativeStartDayPivot:
                  type: integer
                  description: Window start, in days relative to today. Defaults to -365.
                relativeEndDayPivot:
                  type: integer
                  description: Window end, in days relative to today. Defaults to 0.
      responses:
        "201":
          description: Created award saved search
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SavedSearch"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/awards/saved_searches/{id}:
    get:
      tags: [Saved Searches]
      operationId: show_award_saved_search
      summary: Show an award saved search
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Award saved search
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/SavedSearch"
                  meta:
                    $ref: "#/components/schemas/SavedSearchWindowMeta"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      tags: [Saved Searches]
      operationId: update_award_saved_search
      summary: Update an award saved search
      description: >
        Merges the supplied criteria into the stored ones. Only supplied keys change;
        omitted keys are left as they are, and there is no way to remove a stored
        filter — recreate the saved search to clear one. Award saved searches do
        not send notifications.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                query:
                  type: string
                searchType:
                  type: string
                  enum: [fed, sled, international]
                recipientNames:
                  type: array
                  items:
                    type: string
                buyerNames:
                  type: array
                  items:
                    type: string
                funderNames:
                  type: array
                  items:
                    type: string
                naics:
                  type: array
                  items:
                    type: string
                psc:
                  type: array
                  items:
                    type: string
                amountRange:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
                placeIds:
                  type: array
                  items:
                    type: string
                  description: >
                    Canonical Govly Place ids to scope the saved search to. Replaces the
                    stored set; an empty array does not clear it.
                placeIdsNone:
                  type: array
                  items:
                    type: string
                  description: Canonical Govly Place ids to exclude.
                dateRangeParam:
                  type: string
                relativeStartDayPivot:
                  type: integer
                relativeEndDayPivot:
                  type: integer
                active:
                  type: boolean
                  description: Set false to deactivate the saved search.
      responses:
        "200":
          description: Updated award saved search
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SavedSearch"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
