  /api/tools/v1/workspaces/search:
    post:
      tags: [Workspaces]
      operationId: search_workspaces
      summary: Search active workspaces
      description: >
        Searches the authenticated organization's workspaces with exact totals and opaque cursor
        pagination. The default scope is current, open workspaces with an opportunity primary focus
        or no primary focus. Explicit participants narrow organization participation and never grant
        access. A user participant ID of me selects the authenticated user without embedding their
        organization-user ID. A workspace without a primary focus is represented by
        includeWithoutPrimaryFocus;
        primaryFocusTypes never uses a standalone sentinel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                query:
                  type: string
                  maxLength: 30000
                  description: Search workspace name/description, opportunity display name/title, and your organization's text/select custom-field values.
                cursor:
                  type: string
                  description: Opaque nextCursor from the previous page, bound to the actor and all filters.
                perPage:
                  type: integer
                  default: 25
                  maximum: 100
                primaryFocusTypes:
                  type: array
                  items:
                    type: string
                    enum: [opportunity]
                  description: Primary focus types to include. This beta supports opportunity only.
                includeWithoutPrimaryFocus:
                  type: boolean
                  default: true
                  description: Include workspaces whose primary focus is absent.
                lifecycle:
                  type: string
                  enum: [current, archived]
                  default: current
                  description: Workspace archive state. Current excludes archived Workspaces. Opportunity dates are constrained only by explicit Opportunity filters.
                statusGroup:
                  type: string
                  enum: [open, closed]
                  default: open
                statusCategories:
                  type: array
                  items:
                    type: string
                    enum: [triage, planned, in_progress, completed, canceled]
                  description: Exact workspace categories, intersected with statusGroup.
                workspaceStatusIds:
                  type: array
                  items:
                    type: string
                  description: Current-organization custom workspace status IDs.
                participants:
                  type: array
                  items:
                    $ref: "#/components/schemas/WorkspaceSearchParticipantInput"
                  description: Current-organization users or teams that participate in the workspace. A user ID may be me for the authenticated user.
                participantOperator:
                  type: string
                  enum: [any, all]
                  default: any
                labelIds:
                  type: array
                  items:
                    type: string
                  description: Include workspaces with any selected label belonging to the authenticated organization.
                excludeLabelIds:
                  type: array
                  items:
                    type: string
                  description: Exclude workspaces with any selected label belonging to the authenticated organization.
                opportunityWorkWindow:
                  type: string
                  enum: [active, active_or_recently_ended, ended]
                  description: >-
                    Filters the primary Opportunity only. Active means Respond By is not past
                    and cancellation is absent. Active or recently ended allows Respond By
                    up to 14 days past and cancellation absent or up to 72 hours past.
                    For both, missing Respond By requires Posted At within the past 3 calendar
                    months, evaluated in UTC. Ended means deadline beyond 14 days, missing
                    deadline with Posted At older than 3 months, or cancellation beyond 72 hours.
                    Missing both dates does not establish recency or expiration.
                    Award status does not independently exclude results. Omit for no
                    work-window restriction; other filters are intersected.
                opportunityWorkWindowOperator:
                  type: string
                  enum: [is, is_not]
                  default: is
                  description: Requires opportunityWorkWindow. Negation complements the window within Opportunities only; not active is not an alias for ended.
                opportunityRespondByOperator:
                  type: string
                  enum: [is, is_not]
                  default: is
                  description: Requires opportunityRespondBy. Negation complements the entire range including includeMissing within Opportunities only.
                opportunityRespondBy:
                  type: object
                  additionalProperties: false
                  anyOf:
                    - required: [from]
                    - required: [to]
                  description: >-
                    Inclusive Respond By range on the workspace's primary Opportunity (workable),
                    not related attachments. Relative days are 24-hour offsets evaluated per request.
                    Include missing dates includes only Opportunities without a deadline, not other
                    or null primary focuses. Omit this filter to leave deadline membership unrestricted.
                  properties:
                    from:
                      $ref: "#/components/schemas/WorkspaceDeadlineBound"
                    to:
                      $ref: "#/components/schemas/WorkspaceDeadlineBound"
                    includeMissing:
                      type: boolean
                      default: false
                customFields:
                  type: array
                  maxItems: 50
                  description: >-
                    Typed custom-field filters for the authenticated organization. Text uses
                    contains; select uses is_any_of/is_not_any_of; multiselect uses
                    includes/includes_all/excludes; number uses equals/gt/gte/lt/lte; date uses
                    on/before/after with YYYY-MM-DD. Every type also supports is_set/is_not_set
                    without value. Option operators require an array.
                  items:
                    $ref: "#/components/schemas/WorkspaceCustomFieldFilterInput"
      responses:
        "200":
          description: Matching workspaces
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceSearchResult"
                  meta:
                    $ref: "#/components/schemas/WorkspaceSearchMeta"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
