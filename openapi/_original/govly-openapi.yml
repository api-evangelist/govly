              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductCatalog"
                  meta:
                    $ref: "#/components/schemas/ProductCatalogListMeta"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/product_catalogs/search:
    post:
      tags: [Product Catalogs]
      operationId: search_product_catalog
      summary: Search product catalog items
      description: >
        Search line items across government contract price lists for negotiated
        pricing, part numbers, and availability, with the constrained public
        parameter set shared by MCP search_product_catalog. query is a fuzzy search
        over item descriptions, manufacturers, and part numbers; productCatalogIds,
        group, category, manufacturer, and priceRange are exact filters
        AND-combined with query. productCatalogIds is always intersected with the
        public catalogs, so any other ids drop out rather than erroring. Results are
        relevance-ordered; there is no sort control. Paginate with cursor; a request
        carrying a page number is rejected with 400.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                query:
                  type: string
                  maxLength: 500
                  description: Search text over item description, manufacturer, and part numbers.
                cursor:
                  type: string
                  description: >
                    Opaque cursor from a previous response's meta.nextCursor. Omit
                    for the first page.
                perPage:
                  type: integer
                  default: 25
                  description: >
                    Results per page. Default 25, maximum 100. Non-enterprise MCP
                    access is capped at 50; REST access is Enterprise-only.
                productCatalogIds:
                  type: array
                  items:
                    type: integer
                  description: >
                    Restrict to these catalog ids, from list_product_catalogs.
                    Intersected with the catalogs the caller may access.
                group:
                  type: string
                  description: >
                    Exact filter on catalog group, a free-text bucket set at upload
                    (for example "ESI" for the DoD Enterprise Software Initiative).
                category:
                  type: string
                  description: Exact filter on the item's product category.
                manufacturer:
                  type: string
                  description: Exact filter on the item's manufacturer name.
                priceRange:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
                  description: >
                    Filter on contract price as [min, max]. Items with no contract price
                    are excluded when this is set.
      responses:
        "200":
          description: Matching catalog items
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductCatalogItem"
                  meta:
                    $ref: "#/components/schemas/ProductCatalogSearchMeta"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
