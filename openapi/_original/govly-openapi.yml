  /api/tools/v1/follows:
    post:
      tags: [Follows]
      operationId: follow_entity
      summary: Follow a Govly entity
      description: >
        Follow, track, or subscribe to changes for a Govly entity. For
        opportunities, awards, or contacts, this creates or reuses the entity's
        default workspace and follows that workspace for the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, id]
              properties:
                type:
                  type: string
                  enum: [opportunity, opp, award, contact]
                  description: Entity type to follow. opp is accepted as an alias for opportunity.
                id:
                  type: string
                  description: Govly entity ID.
                notifications:
                  type: string
                  description: Notification preference for this follow. Omit to use the user's default setting.
      responses:
        "201":
          description: Active follow on the entity's default workspace
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [workspace, membership]
                    properties:
                      workspace:
                        $ref: "#/components/schemas/Workspace"
                      membership:
                        $ref: "#/components/schemas/WorkspaceMember"
                  meta:
                    type: object
                    properties:
                      entityType:
                        type: string
                      entityId:
                        type: string
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [Follows]
      operationId: unfollow_entity
      summary: Unfollow a Govly entity
      description: >
        Stops following an opportunity, award, or contact for the authenticated user.
        Whether anything is cleared is decided entirely by the caller's follow on the
        entity's default workspace. When that follow is in the following state, it is
        cleared along with the caller's follows on every other workspace for the same
        entity, not only the default one returned in the response, and a subsequent
        follow restores the default workspace alone. When there is no default workspace
        for the entity, or the caller's follow on it is in any other state, nothing is
        cleared anywhere and meta.noOp is true — including when the caller holds an
        active follow on a non-default workspace, which this operation cannot clear.
        Idempotent: the call succeeds without writing anything and reports meta.noOp
        true with a null workspace and membership whenever there is
        no follow to clear. Only follows in the following state are cleared — a follow
        in any other state (considered, assigned, invited, disinterested, or already
        unfollowed) is left unchanged and also reports meta.noOp true, so meta.noOp
        true does not by itself mean the user has no workspace membership for the
        entity. A 404 means the target is not currently visible to the caller and does
        not imply that no follow exists; a follow on a target that has left the
        caller's visibility cannot be cleared through this operation. This applies to
        contacts, which are resolvable only while active, and to opportunities, whose
        visibility depends on the caller's access; awards are resolved without a
        visibility filter, so a 404 for an award means it does not exist. Unfollowing
        emits no event, activity, or webhook. The notifications parameter is not
        accepted here and is ignored if sent.
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [opportunity, opp, award, contact]
          description: Entity type to unfollow. opp is accepted as an alias for opportunity.
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Govly entity ID.
      responses:
        "200":
          description: Follow cleared, or already absent
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [workspace, membership]
                    properties:
                      workspace:
                        oneOf:
                          - $ref: "#/components/schemas/Workspace"
                          - type: "null"
                      membership:
                        oneOf:
                          - $ref: "#/components/schemas/WorkspaceMember"
                          - type: "null"
                  meta:
                    type: object
                    required: [entityType, entityId, noOp]
                    properties:
                      entityType:
                        type: string
                      entityId:
                        type: string
                      noOp:
                        type: boolean
                        description: >
                          True when the call changed nothing — either no follow exists,
                          or the existing follow was not in the following state.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/shares:
    post:
      tags: [Shares]
      operationId: share_entity
      summary: Share an opportunity, award, or contact by email
      description: >
        Send an opportunity, award, or contact to one or more recipients by
        email. Delivery is queued immediately and is at-least-once, so a
        transient failure may redeliver to recipients who already received the
        message.


        Recipients can be any email address, including people outside your
        organization who do not have a Govly account. An address with no Govly
        account may also receive a separate invitation to join Govly, so a
        single request can send more than the share itself.


        The identifier form depends on the type. Opportunities take the numeric
        Govly ID. Awards may be addressed by numeric ID or by uniqueKey; the
        uniqueKey returned from award search is accepted directly.


        Sharing an opportunity sends one email per recipient rather than one
        email addressed to everyone. Award and contact shares send a single
        email when no teams are named; naming any team in
        email_recipient_groups gives their remaining recipients one email each
        as well.


        A share may send at most 20 emails per request: each team is one
        email, and each recipient outside a named team is one more. An
        ungrouped award or contact share is a single send and is not limited
        by that count. A second limit applies to addresses rather than emails:
        a request may name at most 20 recipients outside a named team, which is
        what bounds an ungrouped award or contact share.


        A third limit spans requests: across every share surface, a user may
        send at most 300 messages per day to addresses outside their
        organization, counting the join-Govly invitations those shares
        trigger. A request that would cross that limit is refused with a 422
        and sends nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, id, subject, recipients]
              properties:
                type:
                  type: string
                  enum: [award, contact, opp, opportunity]
                  description: Entity type to share. opp is accepted as an opportunity alias.
                id:
                  type: string
                  description: Govly entity ID. Opportunities take the numeric ID; awards also accept a uniqueKey.
                subject:
                  type: string
                  description: Subject line for the email.
                custom_message:
                  type: string
                  description: Optional note included above the record details.
                recipients:
                  type: array
                  minItems: 1
                  description: >
                    Recipients to email. Any address, including people outside
                    your organization. At most 20 outside a named team.
                  items:
                    type: object
                    required: [email]
                    properties:
                      email:
                        type: string
                      name:
                        type: string
                      company:
                        type: string
                email_recipient_groups:
                  type: array
                  description: >
                    Groups recipients already listed above into one email per
                    team. Does not add recipients.
                  items:
                    type: object
                    properties:
                      team_id:
                        type: string
      responses:
        "201":
          description: Recipients the share was sent to
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        email:
                          type: string
                        name:
                          type: string
                        company:
                          type: string
                  meta:
                    type: object
                    properties:
                      entityType:
                        type: string
                      entityId:
                        type: string
                      recipientCount:
                        type: integer
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/opportunities/{opportunityId}/not_interested:
