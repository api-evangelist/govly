openapi: 3.1.0
info:
  title: Govly Tools API
  version: "1.0.0-alpha"
  description: >
    ALPHA / UNSTABLE: This API is still in active development. Endpoint
    behavior, request fields, response fields, error codes, and operation names
    may change before the Tools API is declared stable.

    REST-callable tool surface for agent and automation workflows. Agents are
    the primary consumer, but integrations can be built on this API. Responses
    are JSON for typed clients; MCP tools may render action results into
    text-oriented formats separately.

    Validating requests: validate against this schema in your client before
    sending. Govly ignores a request field it does not recognize rather than
    rejecting it, so a misspelled filter name is not applied — the response
    returns 200 with a broader result set than you intended, and nothing marks
    the difference. Where a request body declares `additionalProperties: false`,
    strict client-side validation is what catches that. Fields sent with the
    wrong type are rejected with 400 on most endpoints; validate types in your
    client too rather than relying on it.

    Rate limits: each resource (for example awards, opportunities, or
    workspaces) allows 70 requests per minute per user. Exceeding it returns
    429 with the standard error envelope, `code: rate_limited`, and a
    `Retry-After` header. Keys sent in the `X-API-KEY` header are also subject
    to the Enterprise API limit of 300 requests per minute per key; see the
    Rate Limits page.
servers:
  - url: https://app.govly.com
security:
  - bearerApiKey: []
  - headerApiKey: []
tags:
  - name: Opportunities
    description: Search, fetch, and inspect Govly opportunity records.
  - name: Awards
    description: Search and inspect awarded government contracts.
  - name: Contacts
    description: Search and inspect government points of contact.
  - name: Signals
    description: Search clustered procurement and market intelligence signals.
  - name: Places
    description: Resolve place names to canonical Govly Place ids.
  - name: Product Catalogs
    description: List government contract price lists and search their line items.
  - name: Workspaces
    description: Create, update, and inspect opportunity workspaces.
  - name: Organization Users
    description: Discover the members of your organization and their account status.
  - name: Workspace Members
    description: Add users and teams to workspaces.
  - name: Workspace Attachments
    description: List and upload workspace attachments.
  - name: Workspace Comments
    description: Post comments to workspaces.
  - name: Organization Labels
    description: List, create, rename, recolor, and delete the organization's labels.
  - name: Follows
    description: Follow opportunities and related workspace activity.
  - name: Shares
    description: Share opportunities, awards, and contacts with colleagues by email.
  - name: Saved Searches
    description: List saved opportunity searches and cached matches.
  - name: Documents
    description: Read document representations and request temporary original-file downloads.
  - name: Quote Submissions
    description: Inspect quote submission requirements, submit quotes, and poll submission status.
  - name: Inbox
    description: Read and triage the authenticated user's matched inbox items.
paths:
  /api/tools/v1/organization_users:
    get:
      tags: [Organization Users]
      operationId: list_organization_users
      summary: List users in your Govly organization
      description: >
        List the people in the authenticated user's organization, ordered by
        email and organization-user ID. Returns names, emails, roles and account status.
        Excludes service accounts. Archived users are excluded unless includeArchived is
        true and the caller is an organization admin or system admin. Non-admin callers
        requesting archived users still receive only unarchived users. Follow meta.page
        and meta.totalPages to retrieve every page. meta.summary provides total, active,
        deactivated and active-admin counts across users visible to the caller, independently
        of pagination. Deactivated means archived; admins receive that count even when
        archived details are excluded from data. Also available in MCP and GovlyAI as
        list_organization_users.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Visible organization users and pagination metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationUserListResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/opportunities:
    get:
      tags: [Opportunities]
      operationId: fetch_opportunities
      summary: Fetch opportunities by ID
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Opportunities
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Opportunity"
                  meta:
                    $ref: "#/components/schemas/CountMeta"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/opportunities/{id}:
    get:
      tags: [Opportunities]
      operationId: show_opportunity
      summary: Show an opportunity
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Opportunity
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Opportunity"
                  meta:
                    $ref: "#/components/schemas/ActionMeta"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/opportunities/search:
    post:
      tags: [Opportunities]
      operationId: search_opportunities
      summary: Search opportunities
      description: >
        Search opportunities with the constrained public parameter set shared by
        MCP search_opportunities. Defaults to open opportunities and excludes
        prediction records from search results. Searches all dates unless a date bound is supplied,
        orders by newest modified date unless sort is supplied, and returns stored opportunity dates.
        Repeat the same filters with each cursor. Unresolved buyers or unsupported type filters fail
        with 400 rather than returning a broader search.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                query:
                  type: string
                cursor:
                  type: string
                  description: Opaque cursor from the previous response's meta.nextCursor. Omit for the first page.
                perPage:
                  type: integer
                  default: 25
                  maximum: 100
                status:
                  default: open
                  description: >
                    Defaults to open for actionable opportunities. Use all,
                    expired, cancelled, awarded, or not_cancelled for historical
                    or specific lookup requests. Pass an array to match several
                    statuses at once. Prediction records are always excluded.
                  oneOf:
                    - type: string
                      enum: [open, all, expired, cancelled, awarded, not_cancelled]
                    - type: array
                      items:
                        type: string
                        enum: [open, all, expired, cancelled, awarded, not_cancelled]
                naics:
                  type: array
                  items:
                    type: string
                  description: NAICS codes to filter by, such as 541519.
                placeIds:
                  type: array
                  items:
                    type: string
                  description: >
                    Canonical Govly Place ids to filter by, from the place search or list
                    tools. Matches at any administrative level, so a state id also matches
                    opportunities tagged only to a city inside it.
                placeIdsNone:
                  type: array
                  items:
                    type: string
                  description: Canonical Govly Place ids to exclude. Same matching rules as placeIds.
                buyerDescription:
                  type: string
                  description: Federal buyer in natural language. An unrecognized buyer returns 400; use a more specific name. Not supported for sled or international searches.
                includeSubBuyers:
                  type: boolean
                  description: Include child agencies when true; use only with buyerDescription. If omitted, buyer selection determines whether children are included. Explicit false searches the selected buyer only.
                recordType:
                  type: array
                  items:
                    type: string
                    enum: [Solicitation, Event, Other]
                  description: Restrict published record types. Empty or omitted means all published types. Unsupported values are rejected.
                noticeType:
                  type: array
                  items:
                    type: string
                    enum: [Amendment, Award, Catalog Request, Combined Synopsis, Market Research Request, Presolicitation, 'Q&A', Reminder, Request for Information, Request for Proposal, Request for Quote, Reverse Auction, Sources Sought, Event, Industry Day, Presolicitation Conference, Site Visit, Justification, Other]
                  description: Restrict notice types. Empty or omitted adds no restriction. Unsupported values are rejected.
                searchType:
                  type: string
                  enum: [fed, sled, international]
                  description: >
                    Market type: fed for federal, sled for state/local/education,
                    international for non-US. Defaults to the authenticated user's
                    market focus (fed or sled). sled and international require the
                    matching organization subscription.
                postedAfter:
                  type: string
                  description: Only include opportunities posted at or after this date/time. ISO 8601 dates work best.
                postedBefore:
                  type: string
                  description: Only include opportunities posted at or before this date/time. ISO 8601 dates work best.
                modifiedAfter:
                  type: string
                  description: Only include opportunities modified at or after this date/time. ISO 8601 dates work best.
                modifiedBefore:
                  type: string
                  description: Only include opportunities modified at or before this date/time. ISO 8601 dates work best.
                respondByAfter:
                  type: string
                  description: Only include opportunities with a response deadline at or after this date/time. ISO 8601 dates work best.
                respondByBefore:
                  type: string
                  description: Only include opportunities with a response deadline at or before this date/time. ISO 8601 dates work best.
                awardedAfter:
                  type: string
                  description: Only include awarded opportunities awarded at or after this date/time. ISO 8601 dates work best.
                awardedBefore:
                  type: string
                  description: Only include awarded opportunities awarded at or before this date/time. ISO 8601 dates work best.
                sort:
                  type: string
                  enum: [modified_at, posted_at, respond_by, relevance]
                sortDirection:
                  type: string
                  enum: [asc, desc]
      responses:
        "200":
          description: Matching opportunities
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OpportunitySearchResult"
                  meta:
                    $ref: "#/components/schemas/OpportunitySearchMeta"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/awards/{id}:
    get:
      tags: [Awards]
      operationId: show_award
      summary: Show an award
      description: >
        Show a single awarded contract with transactions, sub-awards, related
        opportunities, program links, line items, places, classification codes,
        and contacts. The path parameter accepts
        either identifier shape: an all-digit value is treated as the Govly
        award database id; anything else is treated as the award uniqueKey
        (such as CONT_AWD_... or CONT_IDV_...).
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Award
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Award"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/awards/search:
    post:
      tags: [Awards]
      operationId: search_awards
      summary: Search awards
      description: >
        Search awarded government contracts with the constrained public
        parameter set shared by MCP search_awards. Searches all time unless
        dateRange is given. searchType defaults to the authenticated user's
        market focus (fed or sled); sled and international require the matching
        organization subscription.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                query:
                  type: string
                  description: Search text. Supports keywords, quoted phrases, and boolean operators such as AND, OR, and NOT.
                cursor:
                  type: string
                  description: >
                    Opaque pagination token from the previous response's
                    meta.nextCursor. Omit for the first page. Tokens are bound
                    to the query, filters, and sort inputs and carry no format
                    guarantee.
                perPage:
                  type: integer
                  default: 25
                  maximum: 100
                searchType:
                  type: string
                  enum: [fed, sled, international]
                  description: >
                    Market type. Defaults to the authenticated user's market
                    focus (fed or sled). sled and international require the
                    matching organization subscription.
                dateRange:
                  type: array
                  items:
                    type: string
                  minItems: 2
                  maxItems: 2
                  description: Filter by award action dates as [start, end] in ISO 8601 format. Searches all time when omitted.
                recipientNames:
                  type: array
                  items:
                    type: string
                  description: Filter to awards won by any of these recipient (vendor) names.
                buyerNames:
                  type: array
                  items:
                    type: string
                  description: Filter to awards bought by any of these government buyer names.
                funderNames:
                  type: array
                  items:
                    type: string
                  description: Filter to awards funded by any of these government funder names.
                naics:
                  type: array
                  items:
                    type: string
                  description: NAICS codes to filter by, such as 334111.
                psc:
                  type: array
                  items:
                    type: string
                  description: Product or service codes (PSC) to filter by.
                amountRange:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
                  description: Filter by award amount as [minimum, maximum].
                placeIds:
                  type: array
                  items:
                    type: string
                  description: >-
                    Filter to awards in any of these canonical place ids from
                    POST /api/tools/v1/places/search or /places/list. Ids match
                    at any administrative level (state, county, city, ZIP,
                    school district, military installation).
                placeIdsNone:
                  type: array
                  items:
                    type: string
                  description: Exclude awards in any of these canonical place ids.
                sort:
                  type: string
                  enum: [period_of_performance_start_date, awarded_date, last_modified_date, award_amount]
                  description: >-
                    Sort field. Defaults to period_of_performance_start_date. Use awarded_date
                    for recency or award_amount for contract size. SLED awards often lack
                    period_of_performance_start_date, so prefer awarded_date when searchType is sled.
                sortDirection:
                  type: string
                  enum: [asc, desc]
      responses:
        "200":
          description: Matching awards
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Award"
                  meta:
                    $ref: "#/components/schemas/CursorMeta"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/contacts/{id}:
    get:
      tags: [Contacts]
      operationId: show_contact
      summary: Show a contact
      description: >
        Show a single government point of contact by Govly contact id, with
        titles and associated buyers, vendors, and contract vehicles. Email and
        phone are included for paid callers.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Contact"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/contacts/search:
    post:
      tags: [Contacts]
      operationId: search_contacts
      summary: Search contacts
      description: >
        Search government points of contact with the constrained public
        parameter set shared by MCP search_contacts. Email and phone are never
        returned in search results; use show_contact for a single contact.
        jurisdictionLevel defaults to federal.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                query:
                  type: string
                  description: Search text. Matches names, titles, vendors, buyers, and products. Supports quoted phrases and boolean operators such as AND, OR, and NOT.
                cursor:
                  type: string
                  description: >
                    Opaque pagination token from the previous response's
                    meta.nextCursor. Omit for the first page. Tokens are bound
                    to the query, filters, and sort inputs and carry no format
                    guarantee.
                perPage:
                  type: integer
                  default: 25
                  maximum: 100
                sort:
                  type: string
                  enum: [last_active, opp_count]
                  description: Sort field. Defaults to last_active (most recently active first).
                sortDirection:
                  type: string
                  enum: [asc, desc]
                jurisdictionLevel:
                  type: string
                  enum: [federal, regional]
                  description: Filter by government level - federal (country-level) or regional (state/local). Defaults to federal when omitted. Contacts whose jurisdiction was never recorded omit jurisdictionLevels from the response entirely, and may still match the federal default.
                placeIds:
                  type: array
                  items:
                    type: string
                  description: >
                    Canonical Govly Place ids to filter by. A contact's places are the union
                    of every opportunity they are attached to, so this means "has ever worked
                    in". jurisdictionLevel defaults to federal, so set it explicitly when
                    filtering by a state or local place.
                placeIdsNone:
                  type: array
                  items:
                    type: string
                  description: >
                    Canonical Govly Place ids to exclude. Because a contact's places come from
                    all their opportunities, this excludes anyone whose opportunities ever
                    touched the place, not merely those based there.
                buyerIds:
                  type: array
                  items:
                    type: string
                  description: Filter to contacts associated with any of these Govly buyer (government entity) ids.
                buyerDomains:
                  type: array
                  items:
                    type: string
                  description: Filter to contacts associated with any of these buyer email domains, such as gsa.gov.
                vendorNames:
                  type: array
                  items:
                    type: string
                  description: Filter to contacts associated with any of these vendor names.
                titles:
                  type: array
                  items:
                    type: string
                  description: Filter to contacts holding any of these job titles, such as Contracting Officer.
      responses:
        "200":
          description: Matching contacts
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Contact"
                  meta:
                    $ref: "#/components/schemas/CursorMeta"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/places/search:
    post:
      tags: [Places]
      operationId: search_places
      summary: Resolve place names to canonical Place ids
      description: >
        Resolve a place name to canonical Govly Place ids — counties, municipalities,
        states, ZIP codes, school districts, military installations, and countries.
        Results are relevance-ranked with records-bearing places first. Paging walks
        the matches for a query, not a category — use /api/tools/v1/places/list to
        enumerate a jurisdiction. Place ids are market-agnostic, but opportunity and
        award searches are market-scoped, so a returned id may not be searchable
        under the caller's subscription.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  maxLength: 200
                  description: The place name to resolve, such as "redstone arsenal".
                categories:
                  type: array
                  items:
                    type: string
                    enum: [postal_code, county, municipality, region, country, military_installation, school_district]
                  description: Restrict to these place categories, to disambiguate a name shared across categories.
                isoCodes:
                  type: array
                  items:
                    type: string
                  description: >
                    Restrict to these jurisdiction codes, matched exactly (e.g. US-NC).
                    Not hierarchical — "US" matches only the country record. A bare
                    foreign code such as "JP" scopes overseas military installations.
                cursor:
                  type: string
                  description: >
                    Opaque cursor from the previous response's meta.nextCursor. Omit for the
                    first page. Only valid for the exact query, categories, and isoCodes that
                    produced it.
                perPage:
                  type: integer
                  default: 25
                  maximum: 100
                  description: Results per page. Default 25, maximum 100.
      responses:
        "200":
          description: Matching places
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Place"
                  meta:
                    $ref: "#/components/schemas/PlaceSearchMeta"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/places/list:
    post:
      tags: [Places]
      operationId: list_places
      summary: Enumerate every Place of a category within a jurisdiction
      description: >
        Enumerate every canonical Govly Place of a category within a jurisdiction —
        every county in California, every school district in Texas. At least one of
        categories or isoCodes is required. Without sort, ordering is stable but
        arbitrary, not alphabetical — page until meta.nextCursor is null for the whole
        set, and sort client-side when presenting a list. With sort population and
        sortDirection desc (largest first, default) or asc (smallest first), the N most
        or least populous places are the first N: request perPage N (following
        nextCursor only if meta.perPage is smaller than N). Places without a population
        sort last either way; population exists only for states, counties, and
        municipalities, and a population sort on any other category returns 400. Use
        /api/tools/v1/places/search instead to look up a place by name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                categories:
                  type: array
                  items:
                    type: string
                    enum: [postal_code, county, municipality, region, country, military_installation, school_district]
                  description: Place categories to enumerate, such as county or school_district.
                isoCodes:
                  type: array
                  maxItems: 60
                  items:
                    type: string
                  description: >
                    Jurisdiction codes to enumerate within, matched exactly (e.g. US-CA).
                    Not hierarchical — "US" matches only the country record. A bare
                    foreign code such as "JP" scopes overseas military installations.
                    At most 60 codes per call, which is above the 53 needed to cover
                    every US state and territory at once.
                perPage:
                  type: integer
                  default: 25
                  maximum: 100
                  description: Results per page. Default 25, maximum 100.
                cursor:
                  type: string
                  description: >
                    Opaque cursor from meta.nextCursor of the previous page. A cursor is
                    bound to the filters and sort that produced it and is rejected if you
                    change them.
                sort:
                  type: string
                  enum: [population]
                  description: >
                    population ranks by the latest census population; places without a
                    population sort last. Omit for the default stable-but-arbitrary order.
                sortDirection:
                  type: string
                  enum: [asc, desc]
                  default: desc
                  description: >
                    desc for most populous first, asc for least populous first. Requires sort.
      responses:
        "200":
          description: A page of places
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Place"
                  meta:
                    $ref: "#/components/schemas/PlaceListMeta"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/signals/{id}:
    get:
      tags: [Signals]
      operationId: show_signal
      summary: Show a signal cluster
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Govly signal-cluster database ID.
      responses:
        "200":
          description: Signal cluster detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SignalDetail"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/signals/search:
    post:
      tags: [Signals]
      operationId: search_signals
      summary: Search signals
      description: >
        Search clustered procurement and market signals (news, hearings, laws,
        events, analysis, policy, regulatory actions, and public meetings) with
        the constrained public parameter set shared by MCP search_signals. query
        is a fuzzy, semantic search; contentTypes, categories, and dateRange are
        exact filters AND-combined with query. categories is a hard filter on
        curated slugs and only matches tagged clusters. Paginate with cursor; a
        request carrying a page number is rejected with 400. meta.aggregations
        returns facet counts on the first page only.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                query:
                  type: string
                  maxLength: 500
                  description: Fuzzy + semantic search text over signal content.
                cursor:
                  type: string
                  description: Opaque cursor from the previous response's meta.nextCursor. Omit for the first page.
                perPage:
                  type: integer
                  default: 25
                  description: Results per page. Default 25, maximum 100.
                contentTypes:
                  type: array
                  items:
                    type: string
                    enum: [news, hearing, law, event, analysis, policy, regulatory, meeting]
                  description: Exact filter — only clusters containing signals of these content types.
                categories:
                  type: array
                  items:
                    type: string
                    enum: [regulatory_policy, cybersecurity, defense, technology_digital, infrastructure, healthcare_services, business_compliance]
                  description: >
                    Exact hard filter on curated category slugs. Narrows to tagged
                    clusters; may miss differently-tagged signals. Use for explicit
                    narrowing, not for topics that belong in query.
                dateRange:
                  type: array
                  items:
                    type:
                      - string
                      - "null"
                  maxItems: 2
                  description: Filter by signal date as [start, end] in ISO 8601 format. Use null for an open-ended bound (e.g. [null, end]). Omit or pass an empty array for no date filter.
      responses:
        "200":
          description: Matching signal clusters
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Signal"
                  meta:
                    $ref: "#/components/schemas/SignalSearchMeta"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/product_catalogs:
    get:
      tags: [Product Catalogs]
      operationId: list_product_catalogs
      summary: List public product catalogs
      description: >
        List the public government contract price lists (product catalogs).
        Returns catalog metadata only, no pricing. Not paginated; the catalog set
        is small. Use the returned ids and groups to filter search_product_catalog.
      responses:
        "200":
          description: Public catalogs
          content:
