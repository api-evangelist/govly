        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/quote/submissions:
    get:
      tags: [Quote Submissions]
      operationId: list_quote_submissions
      summary: List quote submissions for a workspace
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Quote submissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteSubmissionListEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [Quote Submissions]
      operationId: create_quote_submission
      summary: Submit a quote
      description: >
        Submit a quote to the destination for an opportunity workspace. Upload
        each file to the workspace attachments endpoint first, then describe
        the destination-specific package in files. Call
        get_quote_submission_requirements for the supported roles, fields, and
        modes. The response returns a submission ID that can be polled with
        show_quote_submission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workspaceId, quoteTotal, files]
              properties:
                workspaceId:
                  type: string
                oppId:
                  type: string
                  description: Optional opportunity ID assertion. It must match the workspace opportunity.
                quoteTotal:
                  type: string
                  description: Decimal quote total accepted by the destination.
                comment:
                  type: string
                  description: Optional destination submission comment.
                destinationData:
                  type: object
                  additionalProperties: true
                  description: Destination-specific fields returned by the requirements endpoint.
                validateOnly:
                  type: boolean
                  description: Validate without submitting when the destination supports validation.
                confirmLiveSubmission:
                  type: boolean
                  description: Confirms a live submission when required by the destination.
                scheduledAt:
                  type: string
                  format: date-time
                  description: Optional future dispatch time.
                files:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [workspaceAttachmentId, role]
                    properties:
                      workspaceAttachmentId:
                        type: string
                      role:
                        type: string
                        description: Destination-specific role returned by the requirements endpoint.
                      metadata:
                        type: object
                        additionalProperties: true
      responses:
        "201":
          description: Created quote submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteSubmissionEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/quote/submissions/{id}:
    get:
      tags: [Quote Submissions]
      operationId: show_quote_submission
      summary: Show quote submission status
      description: >
        Poll this endpoint after create_quote_submission until meta.terminal is
        true. Completed submissions include confirmation details when the portal
        returns them; failed submissions include failureReason when available.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Quote submission status
          content:
