  /api/tools/v1/workspaces/{workspaceId}/members:
    post:
      tags: [Workspace Members]
      operationId: add_workspace_member
      summary: Add a user or team member to a workspace
      description: >
        Adds a member, reactivates a previously removed one, or updates an existing active
        member's notifications. Provide exactly one of userId or teamId; both are resolved
        within the calling user's own organization, so a member from another organization
        returns 404. state accepts only "following" — remove a member with DELETE on this
        path rather than by writing an inactive state.
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: Organization user ID. Provide this or teamId, not both.
                teamId:
                  type: string
                  description: Organization team ID. Provide this or userId, not both.
                notifications:
                  type: string
                  enum: [user_setting, email, muted]
                state:
                  type: string
                  enum: [following]
                  description: Omit to default to following. Use DELETE to remove a member.
      responses:
        "201":
          description: Created or updated workspace membership
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/WorkspaceMember"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [Workspace Members]
      operationId: remove_workspace_member
      summary: Remove a user or team member from a workspace
      description: >
        Removes a member from the workspace. Idempotent: removing a member who is absent or
        already removed succeeds with data null and meta.noOp true rather than 404, and never
        reports whether an id exists. Users may always remove themselves, unless their only
        membership is through a team. Removing anyone else requires belonging to the
        workspace's own organization; a denial is 401. Unlike the add operation, removal
        reaches members from other organizations and members whose user account has been
        archived; neither can be added back by a caller from this workspace's organization,
        only by someone from that member's own organization. Removal ends the membership and
        mutes notifications, but on a private workspace it does not by itself revoke that
        person's access. Note also that updatedAt on the returned membership is not advanced
        by a removal, so it cannot be used to detect one; read state instead.
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - name: userId
          in: query
          required: false
          schema:
            type: string
          description: Organization user ID to remove. Provide this or teamId, not both.
        - name: teamId
          in: query
          required: false
          schema:
            type: string
          description: Organization team ID to remove. Provide this or userId, not both.
      responses:
        "200":
          description: Removed workspace membership, or a no-op when there was nothing to remove
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    description: The cleared membership, or null on a no-op.
                    oneOf:
                      - $ref: "#/components/schemas/WorkspaceMember"
                      - type: "null"
                  meta:
                    type: object
                    required: [noOp]
                    properties:
                      noOp:
                        type: boolean
                        description: True when no membership was changed.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
