          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/inbox_views:
    get:
      tags: [Inbox]
      operationId: list_inbox_views
      summary: List saved Inbox views
      description: >
        List the authenticated user's saved Inbox views and default selection.
        Views belong to the current organization membership. Unavailable views
        remain listed with available false and cannot be used for search.
        Pass an available view's id, or the built-in team_view, as inboxViewId
        to search_inbox_items. This endpoint does not modify views or defaults.
      responses:
        "200":
          description: Saved views and Inbox preferences
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, filters, available]
                      properties:
                        id:
                          type: string
                          description: Saved Inbox view ID.
                        name:
                          type: string
                        filters:
                          type: object
                          additionalProperties: true
                          description: Stored filter snapshot. Use the view ID for search rather than copying snapshot fields into search arguments.
                        available:
                          type: boolean
                          description: Whether the stored snapshot can be resolved for search.
                  meta:
                    type: object
                    required: [inboxDefaultPreset, builtInViews]
                    properties:
                      inboxDefaultPreset:
                        type: string
                        description: Default saved view ID or team_view. Search does not apply this default implicitly.
                      builtInViews:
                        type: array
                        items:
                          type: object
                          required: [id, name]
                          properties:
                            id:
                              type: string
                              enum: [team_view]
                            name:
                              type: string
                              enum: [All Results]
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/inbox_items:
    get:
      tags: [Inbox]
      operationId: list_inbox_items
      summary: List inbox items
      description: >
        List the authenticated user's active inbox items (Govly AI matches and
        saved-search matches), newest first. Continue while meta.nextCursor is
        non-null. A page may contain fewer than perPage records, or no records,
        while a continuation cursor is present; do not infer completion from
        page size.
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/perPage"
      responses:
        "200":
          description: Inbox items
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/InboxItem"
                  meta:
                    $ref: "#/components/schemas/CursorMeta"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/inbox_items/search:
    post:
      tags: [Inbox]
      operationId: search_inbox_items
      summary: Search inbox items
      description: >
        Full-text search and filter the authenticated user's inbox items.
        Returns matchable-type aggregation counts. Use inboxStatus all for pending
        Inbox items, followed for followed Opportunities, or archived for dismissed items. Without an
        inboxStatus or state filter, active items include actioned items.
        Discover saved views through list_inbox_views, then pass inboxViewId.
        A view applies its saved filters, ordering and relative time window;
        only cursor and perPage may accompany inboxViewId. The user's default
        view is not applied implicitly. Continue with the returned cursor to
        retain the same relative time window across pages. A missing view or
        one owned by another user returns 404.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                query:
                  type: string
                cursor:
                  type: string
                  description: Opaque cursor from the previous response's meta.nextCursor. Omit for the first page.
                perPage:
                  type: integer
                  default: 25
                  maximum: 100
                inboxViewId:
                  type: string
                  pattern: '^(team_view|[1-9][0-9]{0,18})$'
                  description: Saved view ID from list_inbox_views, or team_view for All Results. Cannot be combined with explicit filters or sort.
                inboxStatus:
                  type: string
                  enum: [all, followed, archived]
                  description: all selects pending items; followed selects followed Opportunities; archived selects dismissed items. Takes precedence over state when both are supplied.
                sort:
                  type: string
                  enum: [ranked_score, created_at, deadline_at]
                sortDirection:
                  type: string
                  enum: [asc, desc]
                state:
                  type: array
                  items:
                    type: string
                    enum: [unread, seen, actioned, dismissed]
                matchableType:
                  type: array
                  items:
                    type: string
                    enum: [Opp, Award, "ProcurementSignal::Cluster"]
                recordType:
                  type: array
                  items:
                    type: string
                sourceType:
                  type: string
                  enum: [govly_ai, saved_search]
                  description: Saved-search origin IDs are ignored when sourceType is govly_ai.
                market:
                  type: string
                  enum: [all, fed, sled]
                  description: Market scope within the caller's access. all leaves the market unrestricted.
                states:
                  type: array
                  items:
                    type: string
                  description: US state abbreviations for SLED matches, such as CA or CO.
                recordPublicEntityIds:
                  type: array
                  items:
                    $ref: "#/components/schemas/InboxFilterId"
                  description: Include canonical PublicEntity buyer IDs and their descendants. Applies to Opportunities and linked SLED Signals.
                recordPublicEntityIdsNone:
                  type: array
                  items:
                    $ref: "#/components/schemas/InboxFilterId"
                  description: Exclude canonical PublicEntity buyer IDs and their descendants. Applies to Opportunities and linked SLED Signals.
                keywords:
                  type: array
                  items:
                    type: string
                  description: Match any phrase across title, description, buyer names, and identifier. At most 20 distinct nonblank phrases.
                oppSearchIds:
                  type: array
                  items:
                    $ref: "#/components/schemas/InboxFilterId"
                  description: Opportunity saved-search origin IDs. Combined with signalSavedSearchIds using OR.
                signalSavedSearchIds:
                  type: array
                  items:
                    $ref: "#/components/schemas/InboxFilterId"
                  description: Signal saved-search origin IDs. Combined with oppSearchIds using OR.
                naicsCodes:
                  type: array
                  items:
                    type: string
                createdAfter:
                  type: string
                createdBefore:
                  type: string
                deadlineAtFrom:
                  type: string
                deadlineAtTo:
                  type: string
      responses:
        "200":
          description: Matching inbox items
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, aggregations]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/InboxItem"
                  meta:
                    $ref: "#/components/schemas/InboxSearchMeta"
                  aggregations:
                    $ref: "#/components/schemas/InboxAggregations"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/inbox_items/{id}:
    get:
      tags: [Inbox]
      operationId: show_inbox_item
      summary: Show an inbox item
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Inbox item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItemEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/inbox_items/{id}/accept:
    post:
      tags: [Inbox]
      operationId: accept_inbox_item
      summary: Accept an inbox item
      description: >
        Follow an underlying opportunity or award and create or reuse its
        default workspace. Signal acceptance is unsupported and returns 422.
        Opportunity and award accepts are final and cannot be reversed with
        restore. The response meta reports the resulting workspaceId and finality.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Accepted inbox item
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/InboxItem"
                  meta:
                    $ref: "#/components/schemas/InboxAcceptMeta"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/inbox_items/{id}/dismiss:
    post:
      tags: [Inbox]
      operationId: dismiss_inbox_item
      summary: Dismiss an inbox item
      description: >
        Dismiss the item with an optional written explanation retained for future
        analysis. Written feedback does not currently change matching and is not
        returned in API responses. Restoring the item withdraws its written feedback.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                feedbackText:
                  type: string
                  description: >
                    Optional written explanation, limited to 2,000 characters after
                    trimming surrounding whitespace. Blank text is ignored.
      responses:
        "200":
          description: Dismissed inbox item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItemEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/inbox_items/{id}/decline:
    post:
      tags: [Inbox]
      operationId: decline_inbox_item
      summary: Decline (reject) an inbox item as a bad fit
      description: >
        Mark the item a bad fit, optionally with a reason that feeds the
        organization's matching-exclusions memory. Reversible with restore.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  enum: [bad_fit, irrelevant, cannot_bid, bad_timing, other]
      responses:
        "200":
          description: Declined inbox item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItemEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/tools/v1/inbox_items/{id}/restore:
    post:
      tags: [Inbox]
      operationId: restore_inbox_item
      summary: Restore a dismissed or declined inbox item
      description: >
        Return a dismissed or bad-fit item to the active inbox. Only dismissed
        or bad-fit items can be restored — an accepted item cannot.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Restored inbox item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItemEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: API key
    headerApiKey:
      type: apiKey
      in: header
      name: X-API-KEY
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    workspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
    savedSearchId:
      name: savedSearchId
      in: path
      required: true
      schema:
        type: string
    associatedType:
      name: associatedType
      in: query
      required: true
      schema:
        type: string
        enum: [opportunity]
    associatedId:
      name: associatedId
      in: query
      required: true
      schema:
        type: string
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    perPage:
      name: perPage
      in: query
      required: false
      schema:
        type: integer
        default: 25
        maximum: 100
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: >
        Too many requests. Two limiters can produce this status and they use
        different bodies. The per-user limit of 70 requests per minute for each
        resource returns the standard error envelope with `code: rate_limited`
        and a `Retry-After` header. Keys sent in the `X-API-KEY` header are also
        subject to the Enterprise API limit of 300 requests per minute per key,
        which returns the plain `error` form with `Retry-After` and the
        `X-RateLimit-*` headers. Clients should accept either body.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: string
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - $ref: "#/components/schemas/RateLimitError"
  schemas:
    WorkspaceDeadlineBound:
      oneOf:
        - type: object
          additionalProperties: false
          required: [daysFromNow]
          properties:
            daysFromNow:
              type: integer
              minimum: -36500
              maximum: 36500
        - type: object
          additionalProperties: false
          required: [at]
          properties:
            at:
              type: string
              format: date-time
              description: ISO8601 timestamp with explicit timezone offset.
    RateLimitError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    NotInterestedResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, type, notInterested]
          properties:
            id:
              type: string
              description: Govly opportunity ID.
            type:
              type: string
              enum: [opportunity]
            notInterested:
              type: boolean
              description: Whether the opportunity is now marked not interested for the authenticated user.
        meta:
          type: object
          properties:
            oppId:
              type: string
            undo:
              type: boolean
    WorkspaceEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Workspace"
        meta:
          $ref: "#/components/schemas/ActionMeta"
    Workspace:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        commentsCount:
          type: integer
        status:
          type: object
          required: [category, label]
          properties:
            id:
              type: string
              description: Exact custom workspace status ID, when assigned.
            category:
              type: string
              description: Coarse status bucket. Triage is the default for newly created workspaces.
            label:
              type: string
              description: Human-readable status name. Falls back to the category label when no custom status is set.
        primaryFocus:
          $ref: "#/components/schemas/AssociatedEntity"
        comments:
          type: array
          description: Recent comments. Only present on show/create/update responses, capped at the most recent 20.
          items:
            $ref: "#/components/schemas/Comment"
        attachments:
          type: array
          description: Workspace attachments. Only present on show/create/update responses.
          items:
            $ref: "#/components/schemas/WorkspaceAttachment"
        customFields:
          type: array
          description: >-
            Your organization's custom field values for this workspace, ordered
            by field id. Search responses include populated fields plus any
            explicitly filtered field, using null for an unset filtered field.
            Show/create/update responses include every field your organization
            has defined, using null for unset fields.
          items:
            $ref: "#/components/schemas/WorkspaceCustomField"
    WorkspaceCustomField:
      type: object
      required: [id, name, type, value]
      properties:
        id:
          type: string
          description: Stable custom field id, unique within your organization.
        name:
          type: string
          description: Display name. Names are not guaranteed unique; use id as the key.
        type:
          type: string
          enum: [text, select, number, date, multiselect]
          description: Native Workspace custom field type.
        value:
          description: >-
            Raw stored value, or null when the field is unset for this
            workspace. Shape depends on the field type (select fields store the
            option label as a string); keys of object-shaped values are
            camelized.
    WorkspaceSearchParticipantInput:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          enum: [user, team]
        id:
          type: string
          description: Organization-user or team ID. The value me is accepted when type is user.
    WorkspaceCustomFieldFilterInput:
      type: object
      additionalProperties: false
      required: [workspaceColumnId, operator]
      properties:
        workspaceColumnId:
          type: string
        operator:
          type: string
          enum: [contains, is_any_of, is_not_any_of, includes, includes_all, excludes, equals, gt, gte, lt, lte, "on", before, after, is_set, is_not_set]
        value:
          oneOf:
            - type: string
            - type: number
            - type: array
              items:
                type: string
    WorkspaceSearchParticipant:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [user, team]
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
    WorkspaceSearchLabel:
      type: object
      required: [id, name, color]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
        description:
          type: string
        domain:
          type: string
    WorkspaceSearchResult:
      allOf:
        - $ref: "#/components/schemas/Workspace"
        - type: object
          required: [updatedAt, privateAccess, organization, participants, labels, customFields]
          properties:
            archivedAt:
              type: string
              format: date-time
            privateAccess:
              type: boolean
            organization:
              type: object
              required: [id, name]
              properties:
                id:
                  type: string
                name:
                  type: string
            participants:
              type: array
              items:
                $ref: "#/components/schemas/WorkspaceSearchParticipant"
            labels:
              type: array
              items:
                $ref: "#/components/schemas/WorkspaceSearchLabel"
    WorkspaceSearchMeta:
      type: object
      required: [total, perPage]
      properties:
        total:
          type: integer
          description: Exact number of matching workspaces.
        perPage:
          type: integer
        nextCursor:
          type: string
          description: Opaque cursor for the next page. Absent on the final page.
    Comment:
      type: object
      required: [id, body, createdAt, attachments]
      properties:
        id:
          type: string
        body:
          type: string
          description: Markdown body for the comment.
        attachments:
          type: array
          description: Workspace attachments tied to this comment.
          items:
            $ref: "#/components/schemas/WorkspaceAttachment"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PrimaryFocusInput:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [opportunity]
        id:
          type: string
    AssociatedEntity:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [opportunity, award, contact]
        id:
          type: string
    OrganizationUser:
      type: object
      required: [id, name, email, role, active]
      properties:
        id:
          type: string
          description: Organization-user membership ID, not the global user ID.
        name:
          type: string
        email:
          type: string
        role:
          type: string
        active:
          type: boolean
          description: False when the user is archived.
        archivedAt:
          type: [string, "null"]
          format: date-time
          description: Archive timestamp, omitted when the user is not archived.
    OrganizationUserListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationUser"
        meta:
          type: object
          required: [totalCount, page, perPage, totalPages, summary]
          properties:
            totalCount: { type: integer, minimum: 0 }
            page: { type: integer, minimum: 1 }
            perPage: { type: integer, minimum: 1, maximum: 100 }
            totalPages: { type: integer, minimum: 0 }
            summary:
              type: object
              description: Counts over all human users visible to the caller, including archived users when permitted, independent of pagination and includeArchived.
              required: [totalCount, activeCount, deactivatedCount, adminCount]
              properties:
                totalCount: { type: integer, minimum: 0 }
                activeCount:
                  type: integer
                  minimum: 0
                  description: Unarchived users, including members without a paid seat.
                deactivatedCount:
                  type: integer
                  minimum: 0
                  description: Archived users visible to the caller; zero when the caller cannot view archived users.
                adminCount:
                  type: integer
                  minimum: 0
                  description: Unarchived users whose organization role is admin.
    WorkspaceMember:
      type: object
      required: [id, member]
      properties:
        id:
          type: string
        state:
          type: string
        notifications:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        member:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
              enum: [user, team]
            id:
              type: string
            name:
              type: string
            email:
              type: string
              format: email
            organization:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
    WorkspaceAttachment:
      type: object
      required: [id, workspaceId, filename]
      properties:
        id:
          type: string
        workspaceId:
          type: string
        commentId:
          type: string
          nullable: true
        filename:
          type: string
        contentType:
          type: string
        byteSize:
          type: integer
        createdAt:
          type: string
          format: date-time
        file:
          description: Present only on the workspace attachments endpoint. Workspace show responses surface attachments without download metadata.
          $ref: "#/components/schemas/AttachmentFile"
    QuoteSubmissionEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/QuoteSubmission"
        meta:
          $ref: "#/components/schemas/QuoteSubmissionStatusMeta"
    QuoteSubmissionListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/QuoteSubmission"
        meta:
          $ref: "#/components/schemas/CountMeta"
    QuoteSubmissionRequirementsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/QuoteSubmissionRequirements"
    QuoteSubmission:
      type: object
      required: [id, status, terminal, portal, mode, workspaceId, opportunityId, quoteTotal, result, files, createdAt]
      properties:
        id:
          type: string
        status:
          type: string
        terminal:
          type: boolean
        portal:
          type: string
        mode:
          type: string
          enum: [validate, submit]
        workspaceId:
          type: string
        opportunityId:
          type: string
        quoteTotal:
          type: string
        comment:
          type: string
        confirmationNumber:
          type: string
        failureReason:
          type: string
        errorCode:
          type: string
        result:
          type: object
          additionalProperties: true
        scheduledAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        files:
          type: array
          items:
            $ref: "#/components/schemas/QuoteSubmissionFile"
    QuoteSubmissionFile:
      type: object
      required: [id, role, metadata, attachment]
      properties:
        id:
          type: string
        role:
          type: string
          description: Destination-specific role captured for this attempt.
        metadata:
          type: object
          additionalProperties: true
        attachment:
          $ref: "#/components/schemas/QuoteSubmissionAttachment"
    QuoteSubmissionAttachment:
      type: object
      required: [id, filename]
      properties:
        id:
          type: string
        filename:
          type: string
        contentType:
          type: string
        byteSize:
          type: integer
        file:
          $ref: "#/components/schemas/AttachmentFile"
    QuoteSubmissionStatusMeta:
      type: object
      required: [terminal]
      properties:
        terminal:
          type: boolean
          description: True when the submission no longer needs polling.
        nextPollAfterSeconds:
          type: integer
          description: Suggested delay before polling again. Omitted for terminal submissions.
        retryable:
          type: boolean
          description: Present for failed submissions when creating a new submission is reasonable.
    QuoteSubmissionRequirements:
      type: object
      required: [eligible, requiredFields, optionalFields, fileRequirements, supportedModes, availableModes, blockingReasons]
      properties:
        workspaceId:
          type: string
        opportunityId:
          type: string
        portal:
          type: string
        destination:
          type: string
        eligible:
          type: boolean
          description: True when the authenticated actor can submit with the returned requirements.
        requiredFields:
          type: array
          items:
            $ref: "#/components/schemas/QuoteSubmissionField"
        optionalFields:
          type: array
          items:
            $ref: "#/components/schemas/QuoteSubmissionField"
        fileRequirements:
          type: array
          items:
            $ref: "#/components/schemas/QuoteSubmissionFileRequirement"
        supportedModes:
          type: array
          items:
            type: string
            enum: [validate, submit]
        availableModes:
          type: array
          description: Submission modes currently enabled for the authenticated organization.
          items:
            type: string
            enum: [validate, submit]
        defaultMode:
          type: string
          enum: [validate, submit]
        blockingReasons:
          type: array
          items:
            $ref: "#/components/schemas/QuoteSubmissionBlockingReason"
    QuoteSubmissionField:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string
    QuoteSubmissionFileRequirement:
      type: object
      required: [role, label, required, maxBytes, allowedExtensions]
      properties:
        role:
          type: string
        label:
          type: string
        required:
          type: boolean
        maxFiles:
          type: integer
        maxBytes:
          type: integer
        allowedExtensions:
          type: array
          items:
            type: string
        allowedContentTypes:
          type: array
          items:
            type: string
    QuoteSubmissionBlockingReason:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    InboxFilterId:
      description: Positive canonical ID at most 9223372036854775807. Strings preserve precision for large IDs.
      anyOf:
        - type: string
          pattern: '^[1-9][0-9]{0,18}$'
        - type: integer
          minimum: 1
          maximum: 9223372036854775807
    InboxItemEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/InboxItem"
    InboxItem:
      type: object
      required: [id, matchableId, matchableType, state, origins]
      properties:
        id:
          type: string
        matchableId:
          type: string
        matchableType:
          type: string
          enum: [Opp, Award, "ProcurementSignal::Cluster"]
        state:
          type: string
          enum: [unread, seen, actioned, dismissed]
        feedback:
          type: string
          enum: [followed, dismissed, bad_fit]
        feedbackReason:
          type: string
          enum: [bad_fit, irrelevant, cannot_bid, bad_timing, other]
        title:
          type: string
        description:
          type: string
        fitReason:
          type: string
        fitScore:
          type: number
        sourceType:
          type: string
          enum: [govly_ai, saved_search]
          description: How the item first reached the inbox.
        identifier:
          type: string
        recordType:
          type: string
        deadlineAt:
          type: string
          format: date-time
        postedOrAwardedDate:
          type: string
          format: date
        publicEntityNames:
          type: array
          items:
            type: string
        isoCode:
          type: string
        naicsCodes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        highlight:
          type: object
          description: Per-field search highlights. Only present on search results.
          additionalProperties:
            type: string
        origins:
          type: array
          description: Every source that surfaced this (deduped) item.
          items:
            $ref: "#/components/schemas/InboxItemOrigin"
    InboxItemOrigin:
      type: object
      required: [sourceType]
      properties:
        sourceType:
          type: string
          enum: [govly_ai, saved_search]
        savedSearchId:
          type: string
        savedSearchName:
          type: string
    InboxSearchMeta:
      type: object
      required: [total, nextCursor]
      properties:
        total:
          type: integer
          description: Total matching items (capped at 10000 by the search index).
        nextCursor:
          type:
            - string
            - "null"
    InboxAggregations:
      type: object
      required: [matchableType]
      properties:
        matchableType:
          type: object
          description: Count of matching items per matchable type.
          additionalProperties:
            type: integer
    InboxAcceptMeta:
      type: object
      required: [state, feedback, matchableType, matchableId, final]
      properties:
        state:
          type: string
        feedback:
          type: string
        matchableType:
          type: string
        matchableId:
          type: string
        workspaceId:
          type:
            - string
            - "null"
          description: Default workspace followed for the opportunity or award.
        final:
          type: boolean
          description: True for an opportunity or award follow, which cannot be reversed with Inbox restore.
    SavedSearch:
      type: object
      required: [id, name, searchableType, followedByCurrentUser, createdByCurrentUser, createdByName]
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type: boolean
        searchableType:
          type: string
          enum: [Award, Contact]
          description: Which corpus this saved search targets.
        criteria:
          type: object
          additionalProperties: true
          description: >
            The stored filter set. Keys are camelized on the way out like every
            other field, so they do not match the snake_case names a search
            request expects; convert before replaying them.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        followedByCurrentUser:
          type: boolean
          description: True when the requesting user follows this search, directly or through one of their teams.
        createdByCurrentUser:
          type: boolean
          description: True when the requesting user created this search.
        createdByName:
          type:
            - string
            - "null"
          description: Name of the user who created this search, or null when no creator is recorded.
    SavedSearchWindowMeta:
      type: object
      required: [dateRange, dateRangeParam]
      description: >
        The date window this saved search would search, resolved at request
        time. It is not part of `criteria`: date_range is stripped before a
        saved search is persisted and the window is stored as relative day
        offsets, so the stored filters show a date field with no range beside
        it. Returned on show only — a window is per saved search, so it has no
        unambiguous place in a list response.
      properties:
        dateRange:
          type: array
          items:
            type: string
            format: date-time
          description: Absolute window, on Eastern calendar-day boundaries.
        dateRangeParam:
          type: string
          enum: [action_dates, period_of_performance_start_date, period_of_performance_end_date, period_of_performance_potential_end_date, last_modified_date, awarded_date, last_summarized_at]
          description: The award date field the window applies to.
    AwardSavedSearchExecutionMeta:
      type: object
      required: [total, perPage, searchType, nextCursor]
      description: >
        Execution metadata for a live award saved-search run. Distinct from
        CursorMeta, which requires a count this endpoint does not emit.
      properties:
        total:
          type: integer
          description: Matching awards, capped at 10,000 by the search engine.
        perPage:
          type: integer
        searchType:
          type: string
          enum: [fed, sled, international]
          description: The market actually searched.
        searchTypeDefaulted:
          type: boolean
          description: >
            True when the saved search stored no market and federal was applied
            as the default.
        savedSearchId:
          type: string
        savedSearchName:
          type: string
        dateRange:
          type: array
          items:
            type: string
            format: date-time
          description: >
            The absolute window searched, resolved from the saved search's
            stored relative day offsets at request time.
        dateRangeParam:
          type: string
          enum: [action_dates, period_of_performance_start_date, period_of_performance_end_date, period_of_performance_potential_end_date, last_modified_date, awarded_date, last_summarized_at]
          description: The award date field the window was applied to.
        timedOut:
          type: boolean
          description: >
            True when the search engine returned partial results before
            completing. Treat total and data as a lower bound.
        nextCursor:
          type:
            - string
            - "null"
    OppSearch:
      type: object
      required: [id, name, active, criteria, followedByCurrentUser, createdByCurrentUser, createdByName]
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type: boolean
        criteria:
          type: object
          description: Stored search criteria for this saved search.
        matchCount:
          type: integer
        lastMatchedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        followedByCurrentUser:
          type: boolean
          description: True when the requesting user follows this search, directly or through one of their teams.
        createdByCurrentUser:
          type: boolean
          description: True when the requesting user created this search.
        createdByName:
          type:
            - string
            - "null"
          description: Name of the user who created this search, or null when no creator is recorded.
    OppSearchMatch:
      type: object
      required: [id, matchedAt, savedSearchId, opportunity]
      properties:
        id:
          type: string
        matchedAt:
          type: string
          format: date-time
        savedSearchId:
          type: string
        opportunity:
          $ref: "#/components/schemas/Opportunity"
    Opportunity:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Govly opportunity ID. Use this ID for show requests, workspace associations, and links.
        title:
          type: string
        displayName:
          type: string
          description: Human-readable opportunity reference, usually source name plus identifier.
        identifier:
          type: string
          description: Public opportunity identifier, such as a solicitation or request number. This may differ from raw source-system IDs when Govly merges related notices.
        externalUrl:
          type: string
          format: uri
        links:
          type: object
          description: Canonical links for this opportunity. Prefer these over externalUrl.
          required: [self]
          properties:
            self:
              type: string
              format: uri
              description: Canonical Govly app link for this opportunity.
            external:
              type: string
              format: uri
              description: Source-system link, omitted when the source does not provide one.
        recordType:
          type: string
        status:
          type: string
          enum: [open, expired, cancelled, awarded, forecasted, unknown]
        postedAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        respondBy:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
        awardedAt:
          type: string
          format: date-time
        aiTitle:
          type: string
        aiSummary:
          type: string
        aiPeriodOfPerformance:
          type: string
          description: Detail only. AI-generated period-of-performance summary.
        estimatedContractValue:
          type: object
          description: Detail only. Normalized estimated contract value in USD from authorized explicit sources, falling back to the opportunity AI estimate.
          properties:
            min:
              type: number
              format: double
            max:
              type: number
              format: double
        buyer:
          type: object
          description: Search and detail. Government buyer and its hierarchy.
          properties:
            id:
              type: string
            name:
              type: string
            domains:
              type: array
              items:
                type: string
            hierarchy:
              type: array
              items:
                type: string
        locations:
          type: array
          description: Search and detail. Displayable opportunity locations.
          items:
            $ref: "#/components/schemas/OpportunityLocation"
        naics:
          type: array
          description: Search and detail. Most-specific NAICS codes.
          items:
            type: string
        psc:
          type: array
          description: Search and detail. Most-specific Product and Service Codes.
          items:
            type: string
        nigp:
          type: array
          description: Search and detail. Most-specific NIGP codes.
          items:
            type: string
        unspsc:
          type: array
          description: Search and detail. Most-specific UNSPSC codes.
          items:
            type: string
        jurisdiction:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            isoCode:
              type: string
        contractVehicle:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        tags:
          type: object
          description: >-
            Tags grouped by context. Keys are contexts — "contract" holds contract vehicle groups
            such as SEWP V groups (and non-vehicle markers such as "Manual" for hand-created
            opportunities), "warning" holds pursuit cautions such as clearance designations,
            "productCategory" holds product classifications. Each value is a list of objects with a
            stable "slug" and a display "label". An empty object when the opportunity has no tags —
            the key is always present.
          additionalProperties:
            type: array
            items:
              type: object
              required: [slug, label]
              properties:
                slug:
                  type: string
                label:
                  type: string
        followerCount:
          type: integer
          description: Count of active follow rows across visible workspaces for this opportunity.
        followedByCurrentUser:
          type: boolean
          description: Whether the authenticated user actively follows any visible workspace for this opportunity.
        followedByCurrentOrganization:
          type: boolean
          description: Whether the authenticated user's organization actively follows any visible workspace for this opportunity.
        workspaces:
          type: array
          description: Visible workspaces associated with this opportunity, including active follow context.
          items:
            $ref: "#/components/schemas/OpportunityWorkspace"
        aggregateAttachments:
          type: array
          items:
            $ref: "#/components/schemas/OpportunityAttachment"
        opportunitySources:
          type: array
          items:
            $ref: "#/components/schemas/OpportunitySource"
        contacts:
          type: array
          description: Detail only. Up to 100 government contacts linked to the opportunity or its attachments, ordered by id. email and phoneNumbers appear only for paid seats and only when the opportunity's source data is not anonymized for the caller's organization.
          items:
            $ref: "#/components/schemas/OpportunityContact"
    OpportunitySearchResult:
      type: object
      required: [id]
      description: Search fields only. Dates are stored opportunity values; attachment/source detail is available through show_opportunity.
      properties:
        id:
          type: string
          description: Govly opportunity ID. Use this ID for show requests, workspace associations, and links.
        title:
          type: string
        displayName:
          type: string
          description: Human-readable opportunity reference, usually source name plus identifier.
        identifier:
          type: string
          description: Public opportunity identifier, such as a solicitation or request number. This may differ from raw source-system IDs when Govly merges related notices.
        externalUrl:
          type: string
          format: uri
        links:
          type: object
          description: Canonical links for this opportunity. Prefer these over externalUrl.
          required: [self]
          properties:
            self:
              type: string
              format: uri
              description: Canonical Govly app link for this opportunity.
            external:
              type: string
              format: uri
              description: Source-system link, omitted when the source does not provide one.
        recordType:
          type: string
        status:
          type: string
          enum: [open, expired, cancelled, awarded, forecasted, unknown]
        postedAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        respondBy:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
        awardedAt:
          type: string
          format: date-time
        aiTitle:
          type: string
        aiSummary:
          type: string
        buyer:
          type: object
          description: Search and detail. Government buyer and its hierarchy.
          properties:
            id:
              type: string
            name:
              type: string
            domains:
              type: array
              items:
                type: string
            hierarchy:
              type: array
              items:
                type: string
        locations:
          type: array
          description: Search and detail. Displayable opportunity locations.
          items:
            $ref: "#/components/schemas/OpportunityLocation"
        naics:
          type: array
          description: Search and detail. Most-specific NAICS codes.
          items:
            type: string
        psc:
          type: array
          description: Search and detail. Most-specific Product and Service Codes.
          items:
            type: string
        nigp:
          type: array
          description: Search and detail. Most-specific NIGP codes.
          items:
            type: string
        unspsc:
          type: array
          description: Search and detail. Most-specific UNSPSC codes.
          items:
            type: string
        jurisdiction:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            isoCode:
              type: string
        contractVehicle:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        tags:
          type: object
          description: >-
            Tags grouped by context. Keys are contexts — "contract" holds contract vehicle groups
            such as SEWP V groups (and non-vehicle markers such as "Manual" for hand-created
            opportunities), "warning" holds pursuit cautions such as clearance designations,
            "productCategory" holds product classifications. Each value is a list of objects with a
            stable "slug" and a display "label". An empty object when the opportunity has no tags —
            the key is always present.
          additionalProperties:
            type: array
            items:
              type: object
              required: [slug, label]
              properties:
                slug:
                  type: string
                label:
                  type: string
        followerCount:
          type: integer
          description: Count of active follow rows across visible workspaces for this opportunity.
        followedByCurrentUser:
          type: boolean
          description: Whether the authenticated user actively follows any visible workspace for this opportunity.
        followedByCurrentOrganization:
          type: boolean
          description: Whether the authenticated user's organization actively follows any visible workspace for this opportunity.
        workspaces:
          type: array
          description: Visible workspaces associated with this opportunity, including active follow context.
          items:
            $ref: "#/components/schemas/OpportunityWorkspace"
    OpportunitySearchMeta:
      type: object
      required: [total, returnedCount, totalIsLowerBound, perPage, searchType, nextCursor]
      properties:
        total:
          type: integer
          description: Indexed matches, which can exceed visible materialized records. A lower bound when totalIsLowerBound is true.
        returnedCount:
          type: integer
          description: Number of records actually returned on this page.
        totalIsLowerBound:
          type: boolean
          description: Whether the index stopped counting before establishing an exact total.
        perPage:
          type: integer
        searchType:
          type: string
          enum: [fed, sled, international]
        nextCursor:
          type: [string, 'null']
          description: Continue with the same filters while present, even when returnedCount is zero. Buyer selection is reused on subsequent pages.
    OpportunityWorkspace:
      type: object
      required: [id, name, status, followerCount, follows]
      properties:
        id:
          type: string
        name:
          type: string
        organizationDefault:
          type: boolean
        organization:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        status:
          type: object
          required: [category, label]
          properties:
            category:
              type: string
            label:
              type: string
        followerCount:
          type: integer
          description: Count of active follow rows on this workspace.
        followedByCurrentUser:
          type: boolean
        followedByCurrentOrganization:
          type: boolean
        follows:
          type: array
          description: Active workspace follows. Inactive/unfollowed/disinterested rows are omitted.
          items:
            $ref: "#/components/schemas/WorkspaceMember"
    OpportunityLocation:
      type: object
      properties:
        placeLocationId:
          type: string
        postalCode:
          type: string
        city:
          type: string
        region:
          type: string
        street:
          type: string
        place:
          type: string
        country:
          type: string
        countryCode:
          type: string
        label:
          type: string
        type:
          type: string
    OpportunitySource:
      type: object
      required: [id, attachments]
      properties:
        id:
          type: string
        postedAt:
          type: string
          format: date-time
        externalUrl:
          type: string
          format: uri
        noticeType:
          type: string
        recordType:
          type: string
        cancelReason:
          type: string
          description: Original cancellation reason, with source-specific sharing redaction.
        reportedChanges:
          type: array
          description: Source-reported amendments; dates are omitted when the source did not supply them.
          items:
            type: object
            properties:
              amendmentId:
                type: string
              versionNumber:
                type: integer
              modifiedAt:
                type: string
                description: ISO 8601 timestamp or YYYY-MM-DD when only a calendar date is known.
              text:
                type: string
                description: Original change reason, with source-specific sharing redaction.
              documents:
                type: array
                items:
                  type: object
                  required: [filename, status]
                  properties:
                    filename:
                      type: string
                    status:
                      type: string
                      enum: [matched, not_captured, ambiguous]
                    attachment:
                      description: Present for one unambiguous visible revision; ordinary attachment access and URL controls apply.
                      $ref: "#/components/schemas/OpportunityAttachment"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/OpportunityAttachment"
    OpportunityAttachment:
      type: object
      required: [id, documentType, filename, redacted, contentAvailable]
      properties:
        id:
          type: string
          description: Canonical OppAttachment.id. Pass this value to document_read and document_download.
        documentType:
          type: string
          const: opportunity_attachment
        filename:
          type: string
        contentType:
          type: string
        byteSize:
          type: integer
        contentAvailable:
          type: boolean
          description: Whether attachment content is available to the current organization.
        redacted:
          type: boolean
          deprecated: true
          description: Deprecated inverse of contentAvailable. Retained for Tools API v1 compatibility.
        tags:
          type: array
          items:
            type: string
        file:
          $ref: "#/components/schemas/AttachmentFile"
    DocumentType:
      type: string
      enum: [opportunity_attachment, workspace_attachment, session_attachment, document]
    DocumentRepresentation:
      type: string
      enum: [text, positioned_text]
      default: text
    DocumentReadEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/DocumentRead"
        meta:
          $ref: "#/components/schemas/DocumentReadMeta"
    DocumentRead:
      type: object
      required: [id, documentType, filename, status, representation]
      properties:
        id:
          type: string
        documentType:
          $ref: "#/components/schemas/DocumentType"
        filename:
          type: string
        contentType:
          type: string
        byteSize:
          type: integer
        status:
          type: string
          enum: [ready, processing, representation_unavailable]
        representation:
          $ref: "#/components/schemas/DocumentRepresentation"
        content:
          type: string
          description: Bounded content for a ready representation.
        references:
          type: object
          additionalProperties: true
          description: Reference metadata emitted by positioned_text content.
        summary:
          type: string
          description: Optional orientation summary on the initial read. Read source content for precise or exhaustive work.
        availableRepresentations:
          type: array
          description: Representations available for this document, returned on the initial read.
          items:
            $ref: "#/components/schemas/DocumentRepresentation"
        usageHint:
          type: string
          description: MCP-oriented guidance based on summary, continuation, and representation availability.
        message:
          type: string
          description: Guidance when extraction is processing or a requested representation is unavailable.
    DocumentReadMeta:
      allOf:
        - $ref: "#/components/schemas/ActionMeta"
        - type: object
          required: [hasMore, nextCursor]
          properties:
            totalLength:
              type: integer
            returnedLength:
              type: integer
            pageCount:
              type: integer
            contentRange:
              $ref: "#/components/schemas/DocumentContentRange"
            hasMore:
              type: boolean
            nextCursor:
              type:
                - string
                - "null"
              description: Opaque continuation token. Present only in meta and non-null when hasMore is true.
    DocumentContentRange:
      type: object
      required: [pageStart, pageEnd]
      properties:
        pageStart:
          type: integer
          minimum: 1
        pageEnd:
          type: integer
          minimum: 1
    DocumentDownloadEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/DocumentDownload"
    DocumentDownload:
      type: object
      required: [id, documentType, filename, url, expiresAt]
      properties:
        id:
          type: string
        documentType:
          $ref: "#/components/schemas/DocumentType"
        filename:
          type: string
        contentType:
          type: string
        byteSize:
          type: integer
        url:
          type: string
          format: uri
          description: Temporary presigned URL for the original file.
        expiresAt:
          type: string
          format: date-time
    Award:
      type: object
      required: [id]
      description: >
        Stable external award shape. Empty members are omitted rather than
        rendered blank, and money fields are JSON numbers. Detail responses
        (show_award) add bounded collections; search responses return the
        summary shape.
      properties:
        id:
          type: string
        uniqueKey:
          type: string
          description: Stable award business key, such as CONT_AWD_... or CONT_IDV_....
        displayName:
          type: string
        title:
          type: string
        identifier:
          type: string
        description:
          type: string
        aiSummary:
          type: string
        externalUrl:
          type: string
        awardUrl:
          type: string
          deprecated: true
          description: Deprecated alias of links.self. Retained for Tools API v1 compatibility.
        links:
          type: object
          description: Canonical links for this award. Omitted when the award has no unique key.
          required: [self]
          properties:
            self:
              type: string
              format: uri
              description: Canonical Govly app link for this award.
            external:
              type: string
              format: uri
              description: Source-system link, omitted when the source does not provide one.
        acquisitionType:
          type: string
        acquisitionCategory:
          type: string
        searchType:
          type: string
          enum: [fed, sled, international]
        treasuryAccountIds:
          type: array
          items:
            type: string
        dates:
          type: object
          properties:
            awardedDate: { type: string }
            lastModifiedDate: { type: string }
            periodOfPerformanceStartDate: { type: string }
            periodOfPerformanceEndDate: { type: string }
            periodOfPerformancePotentialEndDate: { type: string }
        amounts:
          type: object
          properties:
            awardAmount: { type: number }
            obligatedAmount: { type: number }
            paidAmount: { type: number }
            ceilingAmount: { type: number }
        recipient:
          type: object
          properties:
            name: { type: string }
            uniqueKey: { type: string }
            uei: { type: string }
            cageCode: { type: string }
            parentUniqueKey: { type: string }
            parentName: { type: string }
        buyer:
          $ref: "#/components/schemas/AwardGovernmentEntity"
        buyingOffice:
          $ref: "#/components/schemas/AwardGovernmentEntity"
        funder:
          $ref: "#/components/schemas/AwardGovernmentEntity"
        fundingOffice:
          $ref: "#/components/schemas/AwardGovernmentEntity"
        classification:
          type: object
          properties:
            psc: { type: string }
            naics: { type: string }
            setAside:
              type: object
              properties:
                id: { type: string }
                code: { type: string }
                name: { type: string }
        contractVehicle:
          type: object
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
        parentAward:
          type: object
          properties:
            uniqueKey: { type: string }
            identifier: { type: string }
        jurisdiction:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            isoCode: { type: string }
        transactions:
          type: array
          description: Detail only. Up to 100, newest action first.
          items:
            type: object
        subAwards:
          type: array
          description: Detail only. Up to 100 award summaries.
          items:
            type: object
        subAwardsCount:
          type: integer
          description: Detail only.
        relatedOpportunities:
          type: array
          description: Detail only. Up to 25, newest posting first.
          items:
            type: object
        programLinks:
          type: array
          description: Detail only. Up to 100.
          items:
            type: object
        awardLineItems:
          type: array
          description: Detail only. Up to 100.
          items:
            type: object
        places:
          type: array
          description: Detail only. AI-extracted places, most specific category first.
          items:
            type: object
        classificationCodes:
          type: array
          description: Detail only. Up to 100 resolved classification codes with codeset.
          items:
            type: object
        contacts:
          type: array
          description: Detail only. Up to 100 associated contacts (id, name, email).
          items:
            type: object
    AwardGovernmentEntity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
    ActionMeta:
      type: object
      properties:
        availableActions:
          type: array
          description: Structured hints for useful follow-up actions. These are advisory; clients should still rely on tool schemas and authorization.
          items:
            $ref: "#/components/schemas/AvailableAction"
        sourceCoverage:
          type: object
          description: Result-local source inventory and guidance for claims that require opportunity attachment content.
          required: [opportunityAttachmentCount, guidance]
          properties:
            opportunityAttachmentCount:
              type: integer
              minimum: 0
            guidance:
              type: string
    AvailableAction:
      type: object
      required: [name, description, arguments, idPaths]
      properties:
        name:
          type: string
          description: MCP/tool operation name.
        description:
          type: string
        arguments:
          type: object
          description: Static arguments to pass to the action.
        idPaths:
          type: array
          description: JSON paths where IDs for this action can be found in the current response.
          items:
            type: string
    AttachmentFile:
      type: object
      description: Presigned download metadata. Omitted when attachment content is unavailable or URLs are excluded.
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    CountMeta:
      type: object
      required: [count]
      properties:
        count:
          type: integer
    OrganizationLabelEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/OrganizationLabel"
        meta:
          type: object
    OrganizationLabel:
      type: object
      required: [id, name, color]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
          description: Hex color such as #007bff.
        description:
          type: string
          description: Omitted when the label has no description.
    Contact:
      type: object
      required: [id]
      description: >
        Stable external contact shape. Empty members are omitted. Search
        responses (search_contacts) return the summary shape without email or
        phone; detail responses (show_contact) add email and phoneNumbers for
        paid callers.
      properties:
        id:
          type: string
        name:
          type: string
        names:
          type: array
          items:
            type: string
        active:
          type: boolean
        lastActive:
          type: string
        oppCount:
          type: integer
        titles:
          type: array
          items:
            type: string
        jurisdictionLevels:
          type: array
          items:
            type: string
        contactUrl:
          type: string
          deprecated: true
          description: Deprecated alias of links.self. Retained for Tools API v1 compatibility.
        links:
          type: object
          description: Canonical links for this contact. Omitted for inactive contacts.
          required: [self]
          properties:
            self:
              type: string
              format: uri
              description: Canonical Govly app link for this contact.
        buyers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
        vendors:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
        contractVehicles:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              slug:
                type: string
              name:
                type: string
        setAsides:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              code:
                type: string
              name:
                type: string
        placeLocations:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              city:
                type: string
              region:
                type: string
              postalCode:
                type: string
        publicEntity:
          type: object
          description: The government entity this contact belongs to. Detail responses only.
          properties:
            id:
              type: string
            name:
              type: string
        email:
          type: string
          description: Returned on show for paid callers; never present in search results.
        phoneNumbers:
          type: array
          items:
            type: string
          description: Returned on show for paid callers; never present in search results.
    OpportunityContact:
      type: object
      required: [id]
      description: A contact embedded in show_opportunity, including identity, titles, active status, and permitted email and phone numbers. When active is true, use show_contact for buyers, vendors, and places.
      properties:
        id:
          type: string
        name:
          type: string
        titles:
          type: array
          items:
            type: string
        active:
          type: boolean
        email:
          type: string
          description: Present only for paid callers when the opportunity is not anonymized for their organization.
        phoneNumbers:
          type: array
          items:
            type: string
          description: Present only for paid callers when the opportunity is not anonymized for their organization.
    Signal:
      type: object
      description: >
        A procurement signal cluster — a group of related signals (news, events,
        meetings, ...) about the same topic. Empty and null fields are omitted.
      required: [id]
      properties:
        tagLabels:
          type: array
          description: Display labels flattened from the signal cluster tags.
          items:
            type: string
        id:
          type: string
        name:
          type: string
        executiveSummary:
          type: string
        firstPublishedAt:
          type: string
          format: date-time
        latestPublishedAt:
          type: string
          format: date-time
        contentTypes:
          type: array
          items:
            type: string
          description: Distinct content types of the signals in this cluster.
        signalCount:
          type: integer
        jurisdictions:
          type: array
          items:
            type: string
        industryTags:
          type: array
          items:
            type: string
        topicTags:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
          description: Curated category slugs computed from the cluster's tags.
        sourceNames:
          type: array
          items:
            type: string
        signalUrl:
          type: string
          deprecated: true
          description: Deprecated alias of links.self. Retained for Tools API v1 compatibility.
        links:
          type: object
          description: Canonical links for this signal cluster. Source-system links belong to individual source records.
          required: [self]
          properties:
            self:
              type: string
              format: uri
              description: Canonical Govly app link for this signal.
        vendors:
          type: array
          items:
            type: object
        governmentEntities:
          type: array
          items:
            type: object
        contacts:
          type: array
          items:
            type: object
        eventStartDate:
          type: string
          description: Present only for clusters containing an event signal.
        bodyName:
          type: string
          description: Meeting body name; present only for clusters containing a meeting signal.
    SignalDetail:
      allOf:
        - $ref: "#/components/schemas/Signal"
        - type: object
          required: [signals]
          properties:
            signals:
              type: array
              description: Source records in this signal cluster. Transcript, media, attachment, and raw enrichment fields are excluded.
              items:
                $ref: "#/components/schemas/SignalSource"
    SignalSource:
      type: object
      required: [id]
      properties:
        id:
          type: string
        url:
          type: string
        sourceName:
          type: string
        title:
          type: string
        executiveSummary:
          type: string
        contentType:
          type: string
        jurisdiction:
          type: string
        flowName:
          type: string
        collectionMethod:
          type: string
        publishedAt:
          type: string
          format: date-time
    SignalSearchAggregations:
      type: object
      description: >
        Facet counts returned on the first page only, covering the filter
        dimensions (`categories`, `contentTypes`) plus `jurisdictions`, which is
        discovery-only and has no filter input. Each entry is an array of
        { value, count } objects. Facets are computed from the indexed snapshot
        and can lag the result fields (which reflect current data), so counts
        may differ from what is in `data`.
      properties:
        categories:
          type: array
          items:
            type: object
        contentTypes:
          type: array
          items:
            type: object
        jurisdictions:
          type: array
          items:
            type: object
    Place:
      type: object
      description: A canonical Govly Place, resolved from a name.
      required: [id, name, category, jurisdictionIsoCode, hasRecords]
      properties:
        id:
          type: string
          description: >
            Govly Place id, as a string. Matches the ES place_ids keyword field
            directly, so it can be used as a filter value without conversion.
        name:
          type: string
        category:
          type: string
          enum: [postal_code, county, municipality, region, country, military_installation, school_district]
        jurisdictionIsoCode:
          type: string
          description: The place's own ISO 3166-1 or 3166-2 code, e.g. US or US-NC.
        hasRecords:
          type: boolean
          description: >
            False means the place is in the gazetteer but matches no opportunities
            or awards, so filtering by its id returns nothing. Place search reports
            a periodically refreshed indexed value while place list computes it from
            live data, so the two can briefly disagree — treat list as authoritative.
        nameMatch:
          type: string
          enum: [exact, partial, semantic]
          description: >
            How the name matched. Optional — omitted entirely when not applicable.
            semantic means the query did not really match and this is the nearest
            record; confirm before filtering on it. partial is expected for county
            and municipality lookups, whose canonical names carry a suffix.
        population:
          type: integer
          description: >
            Latest Census Population Estimates figure for the place. Present only for
            states, counties, and municipalities; omitted entirely when unknown.
        populationYear:
          type: integer
          description: Calendar year of the population estimate. Omitted when population is.
        populationHistory:
          type: array
          description: >
            Yearly Census Population Estimates series, oldest first; the last
            entry matches population and populationYear. Omitted when population is.
          items:
            type: object
            required: [year, population]
            properties:
              year:
                type: integer
              population:
                type: integer
    PlaceSearchMeta:
      type: object
      description: Cursor-paginated result metadata for place search.
      required: [perPage, returned]
      properties:
        perPage:
          type: integer
          description: Effective page size after clamping. Default 25, maximum 100.
        returned:
          type: integer
          description: Places returned on this page.
        nextCursor:
          type: string
          nullable: true
          description: >
            Pass back as cursor for the next page. Absent when there are no more
            matches, and also withheld in the rare case where semantic scoring
            failed mid-query and the results were served from lexical ranking —
            restart the search rather than paging on.
    PlaceListMeta:
      type: object
      description: Cursor pagination metadata for place enumeration.
      required: [perPage, returned, total]
      properties:
        perPage:
          type: integer
          description: Effective page size after clamping. Default 25, maximum 100.
        returned:
          type: integer
          description: Places on this page.
        total:
          type: integer
          description: >
            Exact size of the whole filtered set, independent of page size. Without
            sort, compare it against what you have collected to know whether the walk
            is complete; with a population sort it is only the category's size.
        nextCursor:
          type: string
          nullable: true
          description: >
            Pass as cursor to fetch the next page. Null means the set is exhausted.
            Without sort, keep requesting until it is, or you have only part of the
            answer; with a population sort, stop once you hold the N you need.
            A cursor is bound to the filters and sort that produced it and is rejected
            if you change them.
    SignalSearchMeta:
      type: object
      description: Cursor pagination metadata for signal search.
      required: [total, perPage]
      properties:
        total:
          type: integer
          description: >
            Total matching clusters, capped at 10,000 by the search engine.
            Pagination via nextCursor is not limited by this cap.
        perPage:
          type: integer
        nextCursor:
          type:
            - string
            - "null"
          description: Pass into the next request's cursor; null when the results are exhausted.
        query:
          type:
            - string
            - "null"
        aggregations:
          $ref: "#/components/schemas/SignalSearchAggregations"
    ProductCatalog:
      type: object
      description: A government contract price list. Metadata only; no pricing.
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        group:
          type: string
          description: >
            Free-text bucket set at upload, used to cluster related catalogs
            (for example "ESI"). No fixed vocabulary.
        contractVehicleName:
          type: string
          description: The contract vehicle this catalog belongs to, when it has one.
        itemCount:
          type: integer
          description: Number of line items in the catalog.
        organizationOwned:
          type: boolean
          description: >
            Always false. This endpoint returns only public catalogs, which no
            organization owns. The field is kept for response-shape compatibility.
    ProductCatalogItem:
      type: object
      description: One line item in a product catalog, with its negotiated pricing.
      required: [id]
      properties:
        id:
          type: string
        itemIdentifier:
          type: string
          description: The catalog's own identifier for the item (CLIN, SKU, or similar).
        description:
          type: string
        manufacturer:
          type: string
        manufacturerPartNumber:
          type: string
        vendorPartNumber:
          type: string
        category:
          type: string
        subcategory:
          type: string
        contractNumber:
          type: string
        listPrice:
          type: number
        contractPrice:
          type: number
          description: The negotiated price, and the field priceRange filters on.
        discountPercentage:
          type: number
        productCatalog:
          type: object
          description: The catalog this item belongs to.
          properties:
            id:
              type: string
            name:
              type: string
    ProductCatalogSearchMeta:
      type: object
      description: >
        Cursor pagination metadata for product catalog search. Results are
        relevance-ordered with a stable id tiebreaker, so following nextCursor
        neither repeats nor skips an item while the indexed results remain
        unchanged. Not CursorMeta, whose required count this endpoint does not
        emit.
      required: [total, perPage, nextCursor]
      properties:
        total:
          type: integer
          description: >
            Total matching items (capped at 10,000 by the search engine).
            Pagination via nextCursor is not limited by this cap.
        perPage:
          type: integer
        nextCursor:
          type: [string, "null"]
          description: >
            Opaque cursor for the next page; null when the results are exhausted.
    ProductCatalogListMeta:
      type: object
      description: >
        Count metadata for the catalog list. The endpoint is not paginated, so this
        carries no page fields and does not use CursorMeta.
      required: [totalCount]
      properties:
        totalCount:
          type: integer
          description: Number of catalogs returned.
    CursorMeta:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          description: Number of records in this page.
        totalCount:
          type: integer
          description: >
            Total matching records (award and contact search), capped at 10,000
            by the search engine. Pagination via nextCursor is not limited by
            this cap.
        perPage:
          type: integer
        searchType:
          type: string
          enum: [fed, sled, international]
          description: >
            Market actually searched (opportunity and award search only). Echoes
            the resolved searchType, including the value defaulted from the user's
            market focus when the request omitted it.
        nextCursor:
          type:
            - string
            - "null"
    ErrorEnvelope:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            required: [status, code, title, detail]
            properties:
              status:
                type: string
              code:
                type: string
              title:
                type: string
              detail:
                type: string
              source:
                type: object
                properties:
                  pointer:
                    type: string
