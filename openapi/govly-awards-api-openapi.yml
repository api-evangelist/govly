openapi: 3.2.0
info:
  title: Govly Tools Awards API
  version: 1.0.0-alpha
  description: 'ALPHA / UNSTABLE: This API is still in active development. Endpoint behavior, request fields, response fields, error codes, and operation names may change before the Tools API is declared stable.

    REST-callable tool surface for agent and automation workflows. Agents are the primary consumer, but integrations can be built on this API. Responses are JSON for typed clients; MCP tools may render action results into text-oriented formats separately.

    Validating requests: validate against this schema in your client before sending. Govly ignores a request field it does not recognize rather than rejecting it, so a misspelled filter name is not applied — the response returns 200 with a broader result set than you intended, and nothing marks the difference. Where a request body declares `additionalProperties: false`, strict client-side validation is what catches that. Fields sent with the wrong type are rejected with 400 on most endpoints; validate types in your client too rather than relying on it.

    Rate limits: each resource (for example awards, opportunities, or workspaces) allows 70 requests per minute per user. Exceeding it returns 429 with the standard error envelope, `code: rate_limited`, and a `Retry-After` header. Keys sent in the `X-API-KEY` header are also subject to the Enterprise API limit of 300 requests per minute per key; see the Rate Limits page.'
servers:
- url: https://app.govly.com
security:
- bearerApiKey: []
- headerApiKey: []
tags:
- name: Awards
  description: Search and inspect awarded government contracts.
paths:
  /api/tools/v1/awards/{id}:
    get:
      tags:
      - Awards
      operationId: show_award
      summary: Show an award
      description: 'Show a single awarded contract with transactions, sub-awards, related opportunities, program links, line items, places, classification codes, and contacts. The path parameter accepts either identifier shape: an all-digit value is treated as the Govly award database id; anything else is treated as the award uniqueKey (such as CONT_AWD_... or CONT_IDV_...).'
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Award
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Award'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/tools/v1/awards/search:
    post:
      tags:
      - Awards
      operationId: search_awards
      summary: Search awards
      description: Search awarded government contracts with the constrained public parameter set shared by MCP search_awards. Searches all time unless dateRange is given. searchType defaults to the authenticated user's market focus (fed or sled); sled and international require the matching organization subscription.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                query:
                  type: string
                  description: Search text. Supports keywords, quoted phrases, and boolean operators such as AND, OR, and NOT.
                cursor:
                  type: string
                  description: 'Opaque pagination token from the previous response''s meta.nextCursor. Omit for the first page. Tokens are bound to the query, filters, and sort inputs and carry no format guarantee.

                    '
                perPage:
                  type: integer
                  default: 25
                  maximum: 100
                searchType:
                  type: string
                  enum:
                  - fed
                  - sled
                  - international
                  description: 'Market type. Defaults to the authenticated user''s market focus (fed or sled). sled and international require the matching organization subscription.

                    '
                dateRange:
                  type: array
                  items:
                    type: string
                  minItems: 2
                  maxItems: 2
                  description: Filter by award action dates as [start, end] in ISO 8601 format. Searches all time when omitted.
                recipientNames:
                  type: array
                  items:
                    type: string
                  description: Filter to awards won by any of these recipient (vendor) names.
                buyerNames:
                  type: array
                  items:
                    type: string
                  description: Filter to awards bought by any of these government buyer names.
                funderNames:
                  type: array
                  items:
                    type: string
                  description: Filter to awards funded by any of these government funder names.
                naics:
                  type: array
                  items:
                    type: string
                  description: NAICS codes to filter by, such as 334111.
                psc:
                  type: array
                  items:
                    type: string
                  description: Product or service codes (PSC) to filter by.
                amountRange:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
                  description: Filter by award amount as [minimum, maximum].
                placeIds:
                  type: array
                  items:
                    type: string
                  description: Filter to awards in any of these canonical place ids from POST /api/tools/v1/places/search or /places/list. Ids match at any administrative level (state, county, city, ZIP, school district, military installation).
                placeIdsNone:
                  type: array
                  items:
                    type: string
                  description: Exclude awards in any of these canonical place ids.
                sort:
                  type: string
                  enum:
                  - period_of_performance_start_date
                  - awarded_date
                  - last_modified_date
                  - award_amount
                  description: Sort field. Defaults to period_of_performance_start_date. Use awarded_date for recency or award_amount for contract size. SLED awards often lack period_of_performance_start_date, so prefer awarded_date when searchType is sled.
                sortDirection:
                  type: string
                  enum:
                  - asc
                  - desc
      responses:
        '200':
          description: Matching awards
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Award'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    RateLimitError:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    AwardGovernmentEntity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
    ErrorEnvelope:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            type: object
            required:
            - status
            - code
            - title
            - detail
            properties:
              status:
                type: string
              code:
                type: string
              title:
                type: string
              detail:
                type: string
              source:
                type: object
                properties:
                  pointer:
                    type: string
    Award:
      type: object
      required:
      - id
      description: 'Stable external award shape. Empty members are omitted rather than rendered blank, and money fields are JSON numbers. Detail responses (show_award) add bounded collections; search responses return the summary shape.

        '
      properties:
        id:
          type: string
        uniqueKey:
          type: string
          description: Stable award business key, such as CONT_AWD_... or CONT_IDV_....
        displayName:
          type: string
        title:
          type: string
        identifier:
          type: string
        description:
          type: string
        aiSummary:
          type: string
        externalUrl:
          type: string
        awardUrl:
          type: string
          deprecated: true
          description: Deprecated alias of links.self. Retained for Tools API v1 compatibility.
        links:
          type: object
          description: Canonical links for this award. Omitted when the award has no unique key.
          required:
          - self
          properties:
            self:
              type: string
              format: uri
              description: Canonical Govly app link for this award.
            external:
              type: string
              format: uri
              description: Source-system link, omitted when the source does not provide one.
        acquisitionType:
          type: string
        acquisitionCategory:
          type: string
        searchType:
          type: string
          enum:
          - fed
          - sled
          - international
        treasuryAccountIds:
          type: array
          items:
            type: string
        dates:
          type: object
          properties:
            awardedDate:
              type: string
            lastModifiedDate:
              type: string
            periodOfPerformanceStartDate:
              type: string
            periodOfPerformanceEndDate:
              type: string
            periodOfPerformancePotentialEndDate:
              type: string
        amounts:
          type: object
          properties:
            awardAmount:
              type: number
            obligatedAmount:
              type: number
            paidAmount:
              type: number
            ceilingAmount:
              type: number
        recipient:
          type: object
          properties:
            name:
              type: string
            uniqueKey:
              type: string
            uei:
              type: string
            cageCode:
              type: string
            parentUniqueKey:
              type: string
            parentName:
              type: string
        buyer:
          $ref: '#/components/schemas/AwardGovernmentEntity'
        buyingOffice:
          $ref: '#/components/schemas/AwardGovernmentEntity'
        funder:
          $ref: '#/components/schemas/AwardGovernmentEntity'
        fundingOffice:
          $ref: '#/components/schemas/AwardGovernmentEntity'
        classification:
          type: object
          properties:
            psc:
              type: string
            naics:
              type: string
            setAside:
              type: object
              properties:
                id:
                  type: string
                code:
                  type: string
                name:
                  type: string
        contractVehicle:
          type: object
          properties:
            id:
              type: string
            slug:
              type: string
            name:
              type: string
        parentAward:
          type: object
          properties:
            uniqueKey:
              type: string
            identifier:
              type: string
        jurisdiction:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            isoCode:
              type: string
        transactions:
          type: array
          description: Detail only. Up to 100, newest action first.
          items:
            type: object
        subAwards:
          type: array
          description: Detail only. Up to 100 award summaries.
          items:
            type: object
        subAwardsCount:
          type: integer
          description: Detail only.
        relatedOpportunities:
          type: array
          description: Detail only. Up to 25, newest posting first.
          items:
            type: object
        programLinks:
          type: array
          description: Detail only. Up to 100.
          items:
            type: object
        awardLineItems:
          type: array
          description: Detail only. Up to 100.
          items:
            type: object
        places:
          type: array
          description: Detail only. AI-extracted places, most specific category first.
          items:
            type: object
        classificationCodes:
          type: array
          description: Detail only. Up to 100 resolved classification codes with codeset.
          items:
            type: object
        contacts:
          type: array
          description: Detail only. Up to 100 associated contacts (id, name, email).
          items:
            type: object
    CursorMeta:
      type: object
      required:
      - count
      properties:
        count:
          type: integer
          description: Number of records in this page.
        totalCount:
          type: integer
          description: 'Total matching records (award and contact search), capped at 10,000 by the search engine. Pagination via nextCursor is not limited by this cap.

            '
        perPage:
          type: integer
        searchType:
          type: string
          enum:
          - fed
          - sled
          - international
          description: 'Market actually searched (opportunity and award search only). Echoes the resolved searchType, including the value defaulted from the user''s market focus when the request omitted it.

            '
        nextCursor:
          type:
          - string
          - 'null'
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: 'Too many requests. Two limiters can produce this status and they use different bodies. The per-user limit of 70 requests per minute for each resource returns the standard error envelope with `code: rate_limited` and a `Retry-After` header. Keys sent in the `X-API-KEY` header are also subject to the Enterprise API limit of 300 requests per minute per key, which returns the plain `error` form with `Retry-After` and the `X-RateLimit-*` headers. Clients should accept either body.

        '
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: string
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - $ref: '#/components/schemas/RateLimitError'
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: API key
    headerApiKey:
      type: apiKey
      in: header
      name: X-API-KEY
x-provenance:
  method: harvested
  publisher: Govly
  source: https://docs.govly.com/openapi/tools-v1.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
